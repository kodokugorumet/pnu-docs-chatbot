는 학과사무실로 등록금 반환 신청서를 제출해야 합니다.\n- 제출 서류는 등록금 반환 신청서이며, 학생지원시스템의 등록 및 등록금반환 메뉴를 참고하면 됩니다."], "reasons_a": ["등록금 이월 처리 방식에 대한 핵심 정보가 누락되었으며, 환불 소요 기간에 대한 안내가 부족합니다.", "등록금 이월 처리에 대한 핵심 내용을 누락하였으며, 환불 절차에 대한 추가 정보는 포함했으나 기준답안의 필수 정보가 일부 빠져 있습니다.", "등록금 이월 제도에 대한 언급이 누락되었고, 반환 소요 기간에 대한 정보가 빠져 있어 핵심 사실이 일부 누락되었습니다."], "reasons_b": ["등록금 반환 절차와 조건은 정확히 설명했으나, 휴학 시 등록금이 자동으로 이월된다는 가장 기본적인 처리 방식을 누락하여 정보의 완전성이 부족함.", "등록금 반환에 대한 정보는 포함했으나, 휴학 시 등록금이 이월되어 복학 시 별도 절차 없이 처리된다는 핵심적인 기본 원칙이 누락되었습니다.", "등록금 반환 외에 휴학 시 등록금이 이월된다는 핵심적인 처리 방식을 누락하여 학생에게 필요한 정보가 불완전함."], "sources_a": [{"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0004"}, {"source_title": "재학생 등록금 관련 자주하는 질문(FAQ) 안내.pdf (146KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_42a5d988dc5b54ee5c5759f2:cascade#0002"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "인권 및 성폭력 상담 가이드북(내담자용).pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_c2692578bc9aed14894f48b6:cascade#0089"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0006"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_da817a72d067506c28b988fd:cascade#0007"}, {"source_title": "2026학년도 부산대학교 선행학습영향평가 자체평가보고서(공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_3c1033045c70aedc103d3c41:cascade#0419"}, {"source_title": "★수수금지금품등의신고처리절차.hwp (25KB)", "source_host": "pusan.ac.kr", "chunk_id": "doc_f1aeaf41b31051455cdea420:cascade#0011"}], "sources_b": [{"source_title": "재학생 등록금 관련 자주하는 질문(FAQ) 안내.pdf (146KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_42a5d988dc5b54ee5c5759f2:cascade#0002"}, {"source_title": "2016학년도 제2차 등록금심의위원회 회의록.pdf (106KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_1e6fa9e9ac4906e6efb12a4d:cascade#0003"}, {"sour 실행할 수 있습니다.\n- 학자금대출은 등록금 납부 기간 중에 한국장학재단 누리집 또는 모바일 애플리케이션에서 신청 및 지급 실행을 진행할 수 있습니다.\n- 지급 실행 절차까지 정상적으로 진행하셔야 등록이 완료된 것으로 처리됩니다."], "answers_b": ["- 분할납부 대상자 중 자비로 선납부한 재학생에게는 등록금대출을 실행할 수 있습니다.\n- 학자금 대출은 한국장학재단 누리집이나 모바일 애플리케이션에서 신청할 수 있습니다.\n- 학자금 대출 신청 시간은 09:00부터 24:00까지이며 대출 실행은 등록금 납부 기간 중 09:00부터 17:00까지 가능합니다.\n- 지급 실행 절차까지 완료하여야 정상적으로 등록이 완료된 것으로 인정됩니다.", "- 분할납부 대상자 중 자비로 선납부한 재학생에게는 등록금대출을 실행할 수 있습니다.\n- 학자금대출 신청은 한국장학재단 누리집 또는 모바일 애플리케이션에서 가능합니다.\n- 학자금대출 신청 시간은 09:00부터 24:00까지이며 대출실행은 등록금납부 기간 중 09:00부터 17:00까지 가능합니다.\n- 지급 실행 절차까지 정상적으로 진행하셔야 등록이 완료된 것으로 인정됩니다.", "- 분할납부 대상자 중 자비로 선납부한 재학생에게는 등록금대출을 실행할 수 있습니다.\n- 학자금대출을 이용할 때는 지급 실행 절차까지 진행해야 등록이 완료된 것으로 인정됩니다."], "reasons_a": ["분할납부 신청자의 1회차 대출 불가라는 핵심 제한 조건을 명확히 언급하지 않고, 자비 선납부라는 별도 상황을 전제로 설명하여 기준답안의 핵심 조건이 일부 누락되었습니다.", "분할납부 1회차 대출 불가라는 핵심 제한 조건을 명확히 언급하지 않고, 자비 선납부자라는 별도의 조건을 제시하여 기준답안의 핵심 내용을 일부 누락함.", "분할납부 신청자의 학자금 대출 불가 원칙을 명확히 언급하지 않고 자비 납부자 위주로 설명하여 핵심 조건이 불충분하게 전달되었습니다."], "reasons_b": ["분할납부 신청자의 1회차 대출 불가라는 핵심 제한 사항을 누락하고, 자비 선납부자 대상의 대출 가능 여부만 언급하여 질문에 대한 직접적인 답변이 부족함.", "분할납부 1회차 대출 불가라는 핵심 제한 사항을 명확히 언급하지 않고, 자비 선납부 시에만 가능하다는 식으로 서술하여 질문자가 오해할 소지가 있습니다.", "분할납부 1회차 대출 불가라는 핵심 제한 조건을 명확히 언급하지 않았고, 자비 선납부라는 기준답안에 없는 조건을 전제로 설명하여 정보가 불완전함."], "sources_a": [{"source_title": "재학생 등록금 관련 자주하는 질문(FAQ) 안내.pdf (146KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_42a5d988dc5b54ee5c5759f2:cascade#0012"}, {"source_title": "★ 2026학년도 2학기 학자금 대출 기본계획.hwp (190KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_e940e2e25425621089dc6dad:cascade#0215"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_38405839662c2b5d5c449b30:cascade#0010"}, {"source_title": "재학생 등록금 관련 자주하는 질문(FAQ) 안내.pdf (146KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_42a5d988dc5b54ee5c5759f2:cascade#0011"}, {"source_title": "2026학년도 2학기 재학생 등록금 납부 계획.pdf (233KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_4ce82561e3e142c4f92fe306:cascade#0012 이 받을 수 있고, 금리랑 한도는 어떻게 되나요?", "reference": "AI학업장려 학자금대출은 취업 후 상환 학자금대출(생활비) 상품으로, AI·SW중심대학 및 AI거점대학 사업 대상학과 학부생(정보컴퓨터공학부, 산업공학과 등 지정 학과)이 대상입니다. 대출금리는 1.70% 변동금리이며, 대출한도는 연간 200만 원(개인 총 한도 1,000만 원 이내)입니다. 등록금·생활비 대출과 별도 상품으로 중복지원이 가능합니다.", "answers_a": ["검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다."], "answers_b": ["- 대출금리는 1.70%의 변동금리가 적용되며, 매학기 대출금리는 교육부장관 결정 고시에 따릅니다.\n- 대출한도는 연간 200만 원이며 개인 총 한도는 1,000만 원 이내입니다.", "- 대출금리는 1.70%의 변동금리가 적용되며 매학기 교육부장관 결정 고시에 따릅니다.\n- 대출한도는 연 200만 원이며 총 개인 한도는 1,000만 원 이내로 적용됩니다.", "- AI학업장려 학자금대출의 대출금리는 1.70퍼센트 변동금리이며 매학기 대출금리는 교육부장관 결정 고시에 따릅니다.\n- 대출한도는 연 200만 원이며 총 개인 한도는 1,000만 원 이내로 적용됩니다."], "reasons_a": ["질문에 대한 구체적인 정보(대상 학과, 금리, 한도 등)를 전혀 제공하지 않고 답변을 회피하여 핵심 사실이 모두 누락되었습니다.", "질문에 대한 구체적인 정보(대상 학과, 금리, 한도 등)를 전혀 제공하지 않고 답변을 회피하여 핵심 사실이 모두 누락되었습니다.", "질문에 대한 구체적인 정보(대상 학과, 금리, 한도 등)를 전혀 제공하지 않고 답변을 회피하여 핵심 사실이 모두 누락되었습니다."], "reasons_b": ["대출금리와 한도에 대한 수치는 정확하나, 가장 중요한 지원 대상(AI·SW중심대학 및 AI거점대학 사업 대상학과 학부생)에 대한 정보가 누락되었습니다.", "대출 금리와 한도 수치는 정확하나, 가장 중요한 지원 대상(AI·SW중심대학 및 AI거점대학 사업 대상학과 학부생)에 대한 정보가 누락되었습니다.", "대출 금리와 한도 등 수치는 정확하나, 가장 중요한 지원 대상(AI·SW중심대학 및 AI거점대학 사업 대상학과 학부생)에 대한 정보가 누락되었습니다."], "sources_a": [{"source_title": "2026학년도 2학기 AI학업장려 학자금대출 안내.hwp (120KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_8e29a0983ea7d5759bb215b2:cascade#0185"}, {"source_title": "2026학년도 2학기 AI학업장려 학자금대출 안내.hwp (120KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_8e29a0983ea7d5759bb215b2:cascade#0014"}, {"source_title": "★ 2026학년도 2학기 학자금 대출 기본계획.hwp (190KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_e940e2e25425621089dc6dad:cascade#0009"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}], "sources_b": [{"source_title": "2026학년도 2학기 AI학업장려 학자금대출 안내.hwp (120KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_8e29a0983ea7d5 에서 세종이도인재장학금 디딤돌장학사업의 학자금대출 지원 금액은 학자금대출 원금상환 분야의 경우 1인당 최대 1,000,000원이며, 이자지원 분야의 경우 1인당 최대 500,000원입니다."], "reasons_a": ["지원 금액과 신청 기간은 정확히 기재했으나, 신청 자격(거주 요건) 및 신청 방법(이메일 접수 등)에 대한 핵심 정보가 누락되었습니다.", "기준답안의 핵심 수치와 신청 기간, 자격 요건을 모두 정확하게 포함하고 있으며, 추가된 신청 방법 및 문의처 정보도 사실과 모순되지 않음.", "기준답안의 핵심 수치와 신청 자격 및 기간을 모두 정확하게 포함하고 있으며, 추가된 신청 방법과 문의처 정보도 사실과 모순되지 않습니다."], "reasons_b": ["신청 기간이 누락되었고, 지원 금액의 기준 학기 및 이자 지원 조건에 대해 사실과 다른 부정확한 정보를 제시하였습니다.", "기준답안에 해당 사업에 대한 구체적인 정보가 명시되어 있음에도 불구하고, 정보를 찾을 수 없다고 답변하여 질문에 대한 해결책을 전혀 제시하지 못했습니다.", "지원 금액은 정확히 명시했으나, 질문자가 물어본 신청 기간과 자격 요건 등 핵심 정보가 누락되었습니다."], "sources_a": [{"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622ee:cascade#0004"}, {"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622ee:cascade#0014"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_cc8665ee476fb3f8705b3a01:cascade#0005"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0000"}, {"source_title": "3. 별지 서식 제출 서류(학자금대출 관련)_최종.hwp (602KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_52354229e0dcad0b95a89fd6:cascade#0001"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0018"}, {"source_title": "3. 별지 서식 제출 서류(학자금대출 관련)_최종.hwp (602KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_52354229e0dcad0b95a89fd6:cascade#0005"}, {"source_title": "2026학년도 2학기 AI학업장려 학자금대출 안내.hwp (120KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_8e29a0983ea7d5759bb215b2:cascade#0147"}], "sources_b": [{"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622e 사과정) 또는 로스쿨에 재학 중인 시각장애인, 혹은 석·박사과정으로 해외 유학 중인 시각장애인이 신청할 수 있으며, 2026년 2학기 등록 예정자여야 합니다. 접수기간은 26.7.8(수)~22(수) 2주간입니다. 학업에 필요한 추가비용을 지원하는 장학금이므로 대학교에서 장학금을 지원받았더라도 중복수령이 가능합니다.", "answers_a": ["- 효명장학금은 국내 4년제 정규 대학 및 대학원 석사과정, 로스쿨에 재학 중이거나 석·박사과정으로 해외 유학 중인 시각장애인이 신청할 수 있습니다.\n- 접수 기간은 2026년 7월 8일부터 22일 18시 이전 도착분에 한합니다.\n- 신청을 원하시는 경우 실로암시각장애인복지관 홈페이지에서 양식을 다운로드하여 관련 서류를 준비해 접수하시기 바랍니다.\n- 제출 서류에는 효명장학금 신청서, 자기소개서, 개인정보 수집·활용 동의서, 성적증명서, 주민등록등본, 장애인복지카드 사본 등이 포함됩니다.\n- 기타 자세한 사항은 실로암시각장애인복지관 기획경영팀 또는 홈페이지 공지사항을 통해 확인할 수 있습니다.", "- 효명장학금은 국내 4년제 정규 대학 및 대학원 석사과정, 로스쿨에 재학 중이거나 석·박사과정으로 해외 유학 중인 시각장애인이 신청할 수 있습니다.\n- 접수 기간은 2026년 7월 8일부터 22일 18시 이전 도착분에 한합니다.\n- 신청 서류로는 2026년 하반기 효명장학금 신청서, 자기소개서, 개인정보 수집·활용 동의서, 2026년 1학기 성적증명서, 주민등록등본, 장애인복지카드 사본 등이 있습니다.\n- 타기관 장학금과 중복지원이 가능하며, 관련 문의는 실로암시각장애인복지관 기획경영팀으로 하시기 바랍니다.", "- 효명장학금은 국내 4년제 정규 대학·대학원 석사과정, 로스쿨에 재학 중이거나 석·박사과정으로 해외 유학 중인 시각장애인이 신청할 수 있습니다.\n- 접수 기간은 2026년 7월 8일부터 22일 18시 이전 도착분에 한합니다.\n- 신청 서류로는 2026년 하반기 효명장학금 신청서, 자기소개서, 개인정보 수집·활용 동의서, 2026년 1학기 성적증명서, 주민등록등본, 장애인복지카드 사본이 필요합니다.\n- 타기관 장학금과 중복지원이 가능하며, 자세한 사항은 실로암시각장애인복지관 기획경영팀으로 문의하시기 바랍니다."], "answers_b": ["- 효명장학금은 시각장애가 있는 대학원생을 포함하여 학업에 필요한 추가 비용을 지원하기 위해 마련되었습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다."], "reasons_a": ["기준답안의 핵심 자격 요건과 접수 기간을 정확히 포함하고 있으며, 추가된 신청 방법 및 서류 정보도 사실과 모순되지 않아 매우 충실한 답변임.", "기준답안의 핵심 자격 요건과 접수 기간을 정확히 포함하고 있으며, 추가된 서류 및 문의처 정보도 사실과 모순되지 않아 매우 충실한 답변임.", "기준답안의 핵심 자격 요건, 접수 기간, 중복 수령 가능 여부를 모두 정확히 포함하고 있으며, 추가된 서류 및 문의처 정보는 사실과 모순되지 않음."], "reasons_b": ["효명장학금의 지원 자격과 중복 수령 가능 여부는 언급했으나, 가장 중요한 접수 기간과 구체적인 신청 자격 요건이 누락되었습니다.", "질문에 대한 구체적인 자격 요건과 접수 기간 등 핵심 정보를 전혀 제공하지 않고 답변을 회피하였습니다.", "질문에 대한 구체적인 자격 요건과 접수 기간 등 핵심 정보를 전혀 제공하지 않고 답변을 회피하였습니다."], "sources_a": [{"source_title": "1. 2026년 하반기 시각장애인대학생 및 대학원생을 위한 [효명장학사업] 모집 공고.hwp", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_74d8351fa19b523c6a78f851:cascade#0002"}, {"source_title": "1. 2026년 하반기 시각장애인대학생 t": "www.pusan.ac.kr", "chunk_id": "doc_20d01d2ce30217819bc13bc8:cascade#0001"}, {"source_title": "2013학년도 2차 등록금심의위원회 회의록(12.31).pdf (1MB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_ba05d6bbbd1743402841e615:cascade#0001"}]}, {"id": "svc_sch_06", "category": "scholarship", "role": null, "scores_a": [1, 2, 2], "scores_b": [0, 1, 0], "mean_a": 1.6666666666666667, "mean_b": 0.3333333333333333, "delta_b_minus_a": -1.3333333333333335, "retrieval_hit_a": true, "retrieval_hit_b": true, "rank_a": 3, "rank_b": 2, "evidence_hit_a": true, "evidence_hit_b": true, "sources_changed": true, "query": "국가유공자 자녀인데 부산대에서 등록금을 지원받으려면 언제까지 어떻게 신청해야 하나요?", "reference": "국가보훈대상자(국가유공자 자녀 등)는 2026학년도 2학기 우선선발장학금을 2026. 7. 29.(수) 10:00 ~ 7. 31.(금) 17:00까지 부산대학교 학생지원시스템에서 온라인으로 신청해야 합니다. 지원요건은 직전학기 평점평균 1.51(70/100) 이상이며, 수업연한 동안 등록금 전액이 지원됩니다(국가유공자 본인은 성적·수업연한 제한 없음). 장학금은 등록금 고지서에서 장학금액만큼 감면되는 방식으로 지급됩니다.", "answers_a": ["- 부산대학교에서 국가유공자 자녀가 등록금을 지원받으려면 우선선발장학금을 신청해야 합니다.\n- 신청 대상은 국가유공자 자녀 등 관련 법률 상 교육지원 대상자인 2026학년도 2학기 학부 재학생의 우선선발장학금 신규 신청자입니다.\n- 신청 방법은 부산대학교 학생지원시스템에 접속하여 장학, 장학금신청, 우선선발장학금신청 순으로 이동한 뒤 장학금별 구비서류를 업로드하고 신청하면 됩니다.", "- 부산대학교에서 국가유공자 자녀가 등록금을 지원받으려면 학기별 우선선발장학금 신청 기간에 관련 절차를 거쳐야 합니다.\n- 2026학년도 2학기 학부 재학생의 우선선발장학금 신청 기간은 2026년 7월 29일 10시부터 7월 31일 17시까지입니다.\n- 신청 방법은 부산대학교 학생지원시스템에 접속하여 장학, 장학금신청, 우선선발장학금신청 메뉴에서 장학금별 구비서류를 업로드하고 신청하면 됩니다.", "- 부산대학교에서 국가유공자 자녀가 등록금을 지원받으려면 관련 신청 기간 및 방법에 따라 우선선발장학금을 신청해야 합니다.\n- 2026학년도 2학기 학부 재학생의 경우 신청 기간은 2026년 7월 29일 10:00부터 7월 31일 17:00까지입니다.\n- 신청은 부산대학교 학생지원시스템에 접속하여 장학, 장학금신청, 우선선발장학금신청 순으로 이동한 뒤 장학금별 구비서류를 업로드하면 됩니다."], "answers_b": ["제공된 검색 근거에서 질문에 답할 내용을 확인할 수 없습니다.", "- 제공된 문서에서 부산대학교 국가유공자 자녀 등록금 지원 신청 일정은 2026학년도 2학기 기준 2026.\n- 31.(금) 17:00까지로 확인됩니다.\n- 대상 자격은 관련 법률상 교육지원 대상자인 국가유공자 자녀이며, 직전학기 평점평균 1.51(70/100) 이상이어야 합니다.\n- 신청 방법은 부산대학교 학생지원시스템에 접속하여 장학, 장학금신청, 우선선발장학금신청 순으로 메뉴를 이동한 뒤 장학금별 구비서류를 업로드하여 신청하면 됩니다.\n- 제출 서류는 국가유공자 자녀의 경우 대학수업료등 면제대상자 증명서 1부이며, 원본은 학생과에 직접 또는 우편으로 제출해야 합니다.", "- 제공된 문서에서 부산대학교 국가유공자 자녀 등록금 지원 신청 일정은 입학 시기 및 학기에 따라 상이하게 안내되어 있습니다.\n- 2026학년도 수시모집 합격자의 경우 2026.\n- 16.(금) 17:00까지 신청할 수 있습니다.\n- 2026학년도 정시모집 합격자의 경우 2026.\n- 9.(월) 17:00까지 신청할 수 있습니다."], "reasons_a": ["신청 방법과 대상은 명시했으나, 가장 중요한 신청 기간(2026. 7. 29. ~ 7. 31.)과 성적 기준(평점 1.51 이상) 등 핵심 수치 정보가 누락되었습니다.", "기준답안의 핵심인 신청 기간과 방법이 정확히 포함되었으며, 성적 요건 및 지원 방식에 대한 추가 정보는 사실과 모순되지 않아 높은 점수를 부여함.", "기준답안의 핵심인 신청 기간과 방법을 정확히 안내하였으며, 추가된 구체적인 신청 경로 또한 사실과 모순되지 않음."], "reasons_b": ["기준답안에 명시된 신청 기간 및 방법 등 핵심 정보가 존재함에도 불구하고, 답변자가 정보를 찾지 못했다고 잘못 판단하여 질문에 대한 답변을 전혀 제공하지 않았습니다.", "신청 시작 일시가 누락되었고, 기준답안에 없는 구체적인 신청 경로와 서류 제출 방식이 포함되었으나 핵심적인 신청 기간 정보가 불완전함.", "기준답안에 명시된 2026학년도 2학기 신청 일정과 전혀 다른 입학 시기별 일정을 제시하였으며, 핵심 정보인 신청 방법 및 지원 요건이 누락되어 사실관계가 틀렸습니다."], "sources_a": [{"source_title": "PDF 다운로드", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_eea8935f428713f69be7f816:cascade#0014"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "2026학년도 2학기 학부 우선선발장학금 신청 안내문(1차).hwp", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_2fb575610cfd2f32899fa36b:cascade#0001"}, {"source_title": "HWP 다운로드", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_6645db7e79b08d8ad48b29d5:cascade#0007"}, {"source_title": "2026학년도 수시모집 합격자 유의사항.pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_662ec99c328cc32414712c9a:cascade#0038"}, {"source_title": "2026학년도 재외국민특별전형 모집요강(공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9cb4764f364ffedb798653c7:cascade#0148"}, {"source_title": "[별첨1] 합격자 안내사항(다운로드)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_928fbf4d18b2e1d611704da6:cascade#0058"}, {"source_title": "100% 크게보기", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_fb4e5ae72f424ab99e7fa100:cascade#0017"}], "sources_b": [{"source_title": "PDF 다운로드", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_eea8935f428713f69be7f816:cascade#0014"}, {"source_title": "2026학년도 2학기 학부 우선선발장학금 신청 안내문(1차).hwp", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_2fb575610cfd2f32899fa36b:cascade#0001"}, {"source_title": "HWP 다운로드", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_6645db7e79b08d8ad48b29d5:cascade#0007"}, {"source_title": "2026학년도 수시모집 합격자 유의사항.pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_662ec99c328cc32414712c9a:cascade#0038"}, {"source_title": "2026학년도 재외국민특별전형 모집요강(공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9cb4764f364ffedb798653c7:cascade#0148"}, {"source_title": "[별첨1] 합격자 안내사항(다운로드)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_928fbf4d18b2e1d611704da6:cascade#0058"}, {"source_title": "2026학년도 2학기 학부 우선선발장학금 신청 안내문(1차).hwp", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_2fb575610cfd2f32899fa36b:cascade#0003"}, {"source_title": "[별첨1] 합격자 안내사항(다운로드)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_928fbf4d18b2e1d611704da6:cascade#0061"}]}, {"id": "svc_acad_01", "category": "academic", "role": null, "scores_a": [1, 1, 1], "scores_b": [1, 1, 1], "mean_a": 1, "mean_b": 1, "delta_b_minus_a": 0, "retrieval_hit_a": true, "retrieval_hit_b": true, "rank_a": 4, "rank_b": 3, "evidence_hit_a": true, "evidence_hit_b": true, "sources_changed": true, "query": "수능 영어 등급이 없는 학생인데, 대학영어 분반은 어떻게 정해지고 진단평가는 언제 신청하나요?", "reference": "영어 기초학력 진단평가는 수능영어 무등급이면서 진단평가에 응시한 적이 없는 학부 재학생 중 희망자가 응시할 수 있으며, 응시하지 않으면 대학영어(초급 수준)를 이수하게 됩니다. 2026학년도 2차 수강신청 대비 진단평가 신청기간은 2026. 7. 13.(월) 00:00 ~ 7. 24.(일) 23:45이고, 시험은 2026. 7. 29.(수) ~ 7. 30.(목)에 시행됩니다. TOEIC 820점 이상 등 영어 공인성적 제출자는 신청자에 한해 대학영어 이수가 면제됩니다.", "answers_a": ["- 수능 영어 등급이 없는 학생의 대학영어 분반은 진단평가 미응시 시 초급 수준으로 배정되며, 진단평가에 응시하면 그 결과에 따라 초급, 중급, 고급 분반으로 배정됩니다.\n- 진단평가 응시대상은 수능영어 무등급이면서 진단평가에 응시한 적이 없는 자 중 희망자입니다.\n- 신청경로는 부산대학교 학생지원시스템(https://onestop.pusan.ac.kr) 또는 학생역량지원시스템(my.pusan.ac.kr)에서 학생역량, 비교과활동, 비교과프로그램 순으로 이동하여 영어 기초학력 진단평가를 검색해 신청합니다.", "- 수능 영어 등급이 없는 학생의 대학영어 분반은 진단평가 미응시 시 초급 수준으로 정해지며, 진단평가 응시 시 결과에 따라 초급, 중급, 고급 분반으로 배정됩니다.\n- 진단평가 신청 대상은 수능영어 무등급이면서 진단평가 응시 이력이 없는 학부 재학생 중 희망자입니다.\n- 신청 단계는 학생지원시스템 또는 학생역량지원시스템에 접속하여 비교과활동, 비교과프로그램 순으로 이동한 뒤 영어 기초학력 진단평가를 검색하고 날짜와 시간을 확인하여 신청합니다.\n- 진단평가 응시 시 사진이 부착된 신분증 또는 모바일신분증을 지참해야 하며, 재학 중 1회만 응시할 수 있습니다.", "- 수능 영어 등급이 없는 학생의 대학영어 분반은 진단평가 미응시 시 초급 수준으로 정해지며, 진단평가에 응시할 경우 결과에 따라 초·중·고급 분반으로 배정됩니다.\n- 진단평가 응시대상은 수능영어 무등급이면서 진단평가 응시 이력이 없는 학부 재학생 중 희망자입니다.\n- 신청은 부산대학교 학생지원시스템에 접속하여 학생역량, 비교과활동, 비교과프로그램 순으로 이동한 뒤 검색창에서 영어 기초학력 진단평가를 검색하여 진행합니다.\n- 시험 당일에는 사진이 부착된 신분증을 지참해야 하며, 기초학력 진단평가는 재학 중 1회만 응시할 수 있습니다."], "answers_b": ["- 수능 영어 등급이 없는 학생의 대학영어 분반은 수능 등급 혹은 영어 기초학력 진단평가 결과에 따라 결정됩니다.\n- 신청 대상은 수능영어 무등급이면서 진단평가에 응시한 적이 없는 학부 재학생 중 희망자입니다.\n- 2026학년도 2학기 수강신청 대비 진단평가 신청 기간은 2026.\n- 신청 방법은 부산대학교 학생지원시스템에 접속하여 학생역량, 비교과활동, 비교과프로그램 순으로 이동한 뒤 영어 기초학력 진단평가를 검색하여 날짜와 시간을 확인하고 신청합니다.\n- 수능영어 무등급인 학생이 진단평기에 응시하지 않으면 대학영어 초급 수준을 이수하게 됩니다.", "- 수능 영어 무등급 학생의 대학영어 분반은 진단평가 미응시 시 대학영어 초급 수준으로 배정되며, 진단평가 결과에 따라 이수내용이 결정됩니다.\n- 신/편입생 진단평가 신청기간은 2026.\n- 진단평가 신청은 부산대학교 학생지원시스템 내 학생역량, 비교과활동, 비교과프로그램 메뉴에서 영어 기초학력 진단평가를 검색하여 온라인으로 신청할 수 있습니다.", "- 대학영어 분반은 수능 영어 등급이나 영어 기초학력 진단평가 결과에 따라 결정되며, 진단평가 미응시자 등은 대학영어(초급 수준)를 이수하게 됩니다.\n- 진단평가 신청 대상은 수능 영어 무등급이면서 진단평가 응시 이력이 없는 학부 재학생 중 희망자입니다.\n- 2026학년도 수시 및 정시 모집 합격자의 진단평가 신청기간은 2026.\n- 진단평가 신청 방법은 부산대학교 학생지원시스템에 접속하여 학생역량, 비교과활동, 비교과프로그램 순으로 이동한 뒤 검색창에 영어 기초학력 진단평가를 검색하여 차수와 운영 시간을 확인하고 신청합니다."], "reasons_a": ["대학영어 분반 결정 방식과 응시 대상은 정확히 설명했으나, 질문의 핵심인 진단평가 신청 기간 및 시험 일시 등 필수적인 수치 정보가 모두 누락되었습니다.", "핵심 정보인 2026학년도 진단평가 신청 기간 및 시험 일시가 누락되었으며, 분반 배정 방식에 대한 기준답안의 핵심 내용이 일부 생략되었습니다.", "대학영어 분반 결정 및 응시 자격에 대한 설명은 정확하나, 질문자가 물어본 가장 중요한 정보인 '진단평가 신청 기간'과 '시험 일정'이 누락되었습니다."], "reasons_b": ["진단평가 신청 기간의 구체적인 날짜가 누락되었고, 시험 시행 일자 등 핵심 수치가 일부 빠져 있어 정보 전달이 불완전합니다.", "진단평가 신청 기간이 중간에 끊겨 정확한 날짜 정보가 누락되었으며, 시험 시행일에 대한 정보도 빠져 있어 핵심 사실이 일부 누락되었습니다.", "진단평가 신청 기간이 중간에 끊겨 정확한 날짜 정보가 누락되었으며, 기준답안에 명시된 면제 조건 등 일부 핵심 정보가 포함되지 않았습니다."], "sources_a": [{"source_title": "2026학년도 수시모집 합격자 유의사항.pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_662ec99c328cc324147 chunk_id": "doc_dd2c40f98afc1e043f7caf3a:cascade#0152"}, {"source_title": "상담안내 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_efc7bd992af797e0c85e10ef:cascade#0018"}]}, {"id": "svc_acad_02", "category": "academic", "role": null, "scores_a": [2, 2, 2], "scores_b": [2, 2, 2], "mean_a": 2, "mean_b": 2, "delta_b_minus_a": 0, "retrieval_hit_a": true, "retrieval_hit_b": true, "rank_a": 3, "rank_b": 2, "evidence_hit_a": true, "evidence_hit_b": true, "sources_changed": true, "query": "교환학생 다녀왔는데 파견대학 성적은 어떤 절차로 인정되고 시간이 얼마나 걸리나요?", "reference": "해외 파견대학 성적표가 국제처에 도착하면 국제처가 원본 진위를 확인하고, 학생이 귀국보고 등 파견자 의무사항을 이행한 뒤 소속학과를 방문해 학점인정 신청서와 교수계획표 등을 제출하면 학과·행정실·교육혁신과를 거쳐 성적이 처리됩니다. 이러한 순서 때문에 최종 성적 인정은 성적표가 국제처에 도착한 후 통상적으로 3~4개월이 소요됩니다.", "answers_a": ["- 파견대학 성적은 국제처의 성적표 수령 및 원본 진위 여부 판단 후 학생의 의무사항 이행 및 소속학과 신청 절차를 거쳐 인정되며 통상 3~4개월이 소요됩니다.\n- 신청 절차는 대상 및 자격 요건 충족 후 국제처 성적표 수령, 파견자 의무사항 이행 및 귀국보고 완료 알림 메일 발송 순으로 진행됩니다.\n- 신청 경로 및 단계로는 소속학과를 방문하여 학점인정 신청서 및 교수계획표 등을 제출하고, 소속행정실의 성적 입력 후 교육혁신과의 최종 확인 및 성적 처리를 거칩니다.\n- 제출 서류는 학점인정 신청서, 교수계획표, 영어 외 언어 성적표 발급 시 영문 번역본이 필요합니다.", "- 교환학생 파견대학 성적은 국제처의 성적표 수령 및 진위 여부 판단, 학생의 의무사항 이행 및 메일 발송, 국제처의 학점인정 요청 공문 발송 순서로 처리됩니다.\n- 이어서 학생이 소속학과에 방문하여 학점인정 신청서 및 교수계획표 등을 제출하고, 소속학과 회의와 행정실의 성적 입력 요청을 거쳐 교육혁신과에서 최종 확인 및 성적이 처리됩니다.\n- 최종 성적 인정은 성적표가 국제처에 도착한 후 통상적으로 3~4개월이 소요됩니다.", "- 파견대학의 최종 성적 인정은 성적표가 국제처에 도착한 후 통상적으로 3~4개월이 소요됩니다.\n- 국제처가 성적표를 수령해 진위 여부를 판단하고, 학생이 의무사항 이행 후 아웃바운드 메일로 귀국보고 완료 알림을 발송합니다.\n- 국제처의 학점인정 요청 공문 발송 후 학생이 소속학과에 방문해 학점인정 신청서 및 교수계획표 등을 제출해야 합니다.\n- 소속학과의 학과회의와 행정실의 성적 입력을 거쳐 교육혁신과에서 최종 확인 및 성적 처리를 진행합니다."], "answers_b": ["- 파견대학 성적 인정은 국제처의 성적표 수령 및 진위 여부 판단, 학생의 의무사항 이행 및 메일 발송, 국제처의 학점인정 요청 공문 발송 순으로 진행됩니다.\n- 이후 학생이 소속 학과를 방문해 학점인정 신청서 및 교수계획표 등을 제출하고, 소속 학과의 학과회의 및 행정실의 성적 입력을 거쳐 교육혁신과에서 최종 확인 및 처리가 이루어집니다.\n- 최종 성적 인정은 성적표가 국제처에 도착한 후 통상적으로 3~4개월이 소요됩니다.", "- 파견대학 성적 인정은 국제처의 성적표 수령 및 진위 여부 판단, 학생의 의무사항 이행 및 귀국보고 완료 알림 메일 발송 순서로 진행됩니다.\n- 이후 국제처의 학점인정 요청 공문 발송에 따라 학생은 소속학과를 방문하여 학점인정 신청서 및 교수계획표 등 ", "- 2026학년도 2학기 수강신청과 휴학·복학 신청은 각각 정해진 기간에 진행됩니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다."], "answers_b": ["- 2026학년도 2학기 수강신청은 2026.\n- 2026학년도 2학기 휴·복학 신청 기간은 2026.", "- 2026학년도 2학기 수강신청은 2026.\n- 2026학년도 2학기 휴·복학 신청기간은 2026.", "- 2026학년도 2학기 수강신청과 휴학·복학 신청은 각각 정해진 기간에 진행됩니다."], "reasons_a": ["질문에 대한 구체적인 날짜와 절차 등 핵심 정보를 전혀 제공하지 않고 검색 실패를 알리는 안내문만 제시했기 때문입니다.", "질문자가 요구한 구체적인 날짜와 기간에 대한 정보가 전혀 포함되지 않아 답변으로서의 가치가 없습니다.", "질문에 대한 구체적인 날짜와 절차 등 핵심 정보를 전혀 제공하지 않고 검색 실패를 알리는 안내문만 제시했기 때문입니다."], "reasons_b": ["답변이 문장 중간에 끊겨 핵심 날짜와 기간 정보가 전혀 포함되지 않았습니다.", "답변이 문장 중간에 끊겨 있어 핵심 수치와 날짜 정보가 전혀 제공되지 않았으므로 0점입니다.", "질문자가 요구한 구체적인 날짜와 기간에 대한 정보가 전혀 포함되지 않아 답변으로서의 가치가 없습니다."], "sources_a": [{"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_da817a72d067506c28b988fd:cascade#0003"}, {"source_title": "2026년 하반기 WEST 참가자 모집 공고문.pdf (1MB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_f74f8fe28799f6d02d5e9567:cascade#0070"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0003"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0005"}, {"source_title": "2026학년도 2학기 재학생 등록금 납부 계획.pdf (233KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_4ce82561e3e142c4f92fe306:cascade#0019"}, {"source_title": "학사일정 > 학사/학술 > 대학생활 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_c91a0e3eec5ccf849e582073:cascade#0006"}, {"source_title": "국문(Korean)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_af1dc957d92e2fbc2fb12e45:cascade#0055"}], "sources_b": [{"source_title": "2026학년도 2학기 재학생 등록금 납부 계획.pdf (233KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_4ce82561e3e142c4f92fe306:cascade#0019"}, {"source_title": "학사일정 > 학사/학술 > 대학생활 | 부산대학교", "source_h 입니다.", "- 모듈은 3에서 5개 이상의 교과목을 조합한 동일 학과 내 동일한 학문적 주제로 묶인 펜토미노 교육과정의 기본 구성 단위입니다.\n- 트랙은 특정 진로 또는 자격 취득 등을 위해 2개 이상의 모듈을 구성한 과정입니다.\n- 마이크로디그리는 타 학과의 마이크로디그리 모듈을 15학점 완료하면 소단위전공으로 인증되어 졸업증명서에 기재되는 과정입니다."], "answers_b": ["- 모듈과 트랙, 마이크로디그리는 펜토미노 교육과정 내에서 범위와 이수 방식에 차이가 있습니다.\n- 트랙은 특정 진로 또는 자격 취득 등을 위해 2개 이상의 모듈을 구성한 과정입니다.\n- 마이크로디그리는 타 학과의 마이크로디그리 모듈 15학점을 완료하면 소단위전공으로 인증되는 과정입니다.", "- 모듈, 트랙, 마이크로디그리는 펜토미노 교육과정 내에서 범위와 이수 방식에 차이가 있는 서로 다른 구성 단위입니다.\n- 트랙은 특정 진로 또는 자격 취득 등을 위해 2개 이상의 모듈을 구성한 과정입니다.\n- 마이크로디그리는 타 학과의 마이크로디그리 모듈인 15학점을 완료하면 소단위전공으로 인증되어 졸업증명서에 기재되는 과정입니다.", "- 트랙은 특정 진로 또는 자격 취득 등을 위해 2개 이상의 모듈을 구성한 과정으로 자학과 타 학과의 트랙 이수는 졸업증명서에 기재됩니다.\n- 마이크로디그리는 타 학과나 전공의 마이크로디그리 모듈인 15학점을 완료하면 소단위전공으로 인증되어 졸업증명서에 기재되는 과정입니다."], "reasons_a": ["모듈의 마이크로디그리 승인 시 졸업증명서 기재 여부와 트랙 이수 시 졸업증명서 기재 여부에 대한 핵심 조건이 누락되었습니다.", "모듈의 정의와 마이크로디그리의 개념적 차이(승인 여부 및 학점 요건 등)가 누락되었으며, 마이크로디그리를 단순히 소단위전공과 동일시하여 핵심 조건이 일부 생략되었습니다.", "모듈이 마이크로디그리로 승인되어야만 졸업증명서에 기재된다는 핵심 조건이 누락되었고, 마이크로디그리에 대한 정의가 기준답안보다 좁게 서술되었습니다."], "reasons_b": ["모듈의 정의와 마이크로디그리의 개념적 차이(모듈이 마이크로디그리로 승인되어야 기재된다는 점 등)가 누락되었으며, 마이크로디그리를 소단위전공과 동일시하는 등 핵심 조건 설명이 일부 부족합니다.", "모듈의 정의(3~5개 교과목 조합 등)가 누락되었고, 마이크로디그리에 대한 설명이 기준답안과 달리 모듈과 별개의 개념처럼 서술되어 핵심 사실이 일부 누락되었습니다.", "트랙과 마이크로디그리에 대한 설명은 포함되었으나, 펜토미노 교육과정의 기본 구성단위인 '모듈'에 대한 정의가 누락되었습니다."], "sources_a": [{"source_title": "다운로드 받기", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_e9c2bb88fc8a797bce06189b:cascade#0014"}, {"source_title": "다운로드 받기", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_e9c2bb88fc8a797bce06189b:cascade#0015"}, {"source_title": "2026학년도 재외국민특별전형 모집요강(공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9cb4764f364ffedb798653c7:cascade#0188"}, {"source_title": "2026학년도 재외국민특별전형 모집요강(공고용).hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_393409c656648ee27006768b:cascade#0147"}, {"source_title": "2026학년도 재외국민특별전형 모집요강(2025.6.20)_1차 수정공고.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_0b93eb03f3eaefa24223c639:cas 청도 병행하여 접수할 수 있습니다."], "answers_b": ["- 수료후연구생 신청은 대학원 석사 또는 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자를 대상으로 합니다.\n- 수료후연구생 신청 경로는 학생지원시스템, 학적, 학생신청, 수료후연구생 신청 메뉴에 접속하여 진행할 수 있습니다.\n- 수료후연구생 신청 단계는 수료후연구생 추천서를 다운로드하여 작성한 뒤 신청 버튼을 클릭하고 휴대폰번호를 입력하며 추천서를 첨부한 후 제출 버튼을 누르는 순서로 진행됩니다.", "- 수료후연구생 신청은 대학원 석사 또는 박사과정 수료자로서 각 대학원 지도교수의 추천을 받은 자가 대상입니다.\n- 신청 방법은 학생지원시스템에 접속하여 학적, 학생신청, 수료후연구생 신청 메뉴에서 수료후연구생 추천서를 첨부하고 제출하면 됩니다.", "- 대학원 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자는 수료후연구생을 신청할 수 있습니다.\n- 신청 방법은 학생지원시스템의 학적, 학생신청, 수료후연구생 신청 메뉴에 접속하여 수료후연구생 추천서를 첨부하고 제출하면 됩니다."], "reasons_a": ["수료후연구생 신청의 핵심인 납부 금액(수업료Ⅱ의 10%)과 신청 기간에 대한 정보가 누락되었습니다.", "수료후연구생 신청의 핵심인 등록금 납부 금액과 신청 기간에 대한 정보가 누락되었습니다.", "수료후연구생 신청의 핵심인 등록금(수업료Ⅱ의 10%)과 신청 기간에 대한 정보가 모두 누락되어 있습니다."], "reasons_b": ["수료후연구생 신청 자격과 절차는 상세히 안내했으나, 가장 중요한 핵심 정보인 등록금 납부 금액(수업료Ⅱ의 10%)과 신청 기간에 대한 정보가 누락되었습니다.", "수료후연구생 신청 자격과 절차는 안내했으나, 가장 중요한 납부 금액과 신청 기간에 대한 정보가 모두 누락되었습니다.", "수료후연구생 신청 자격과 절차는 정확히 안내했으나, 가장 중요한 납부 금액과 신청 기간에 대한 정보가 모두 누락되었습니다."], "sources_a": [{"source_title": "1. 2026학년도 2학기 수료후연구생 신청 안내문.pdf (113KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_404d8854faaaeb2a8d6c48d3:cascade#0001"}, {"source_title": "2. (서식) 수료후연구생 추천서, 수기 신청서.pdf", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_57a52634d0a1e9c37ef0878f:cascade#0003"}, {"source_title": "1. 2026학년도 2학기 수료후연구생 신청 안내문.pdf (113KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_404d8854faaaeb2a8d6c48d3:cascade#0000"}, {"source_title": "[PDF]2027학년도 학생부위주전형 가이드북", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9800bc1c38aa5666e76d3bac:cascade#0133"}, {"source_title": "부산대학교", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_d0f51745fb4e05398092537f:cascade#0002"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": " 앙도서관에 제출합니다.", "answers_a": ["- 제공된 문서에서 이번 2025학년도 후기 학위논문 심사 서류의 제출 기한과 심사료 금액에 대한 구체적인 내용을 확인할 수 없습니다.", "- 제공된 문서에서 이번 2025학년도 후기 학위논문 심사 서류의 제출 기한과 심사료 금액에 대한 정확한 내용을 확인할 수 없습니다.", "- 제공된 문서에서 이번 2025학년도 후기 학위논문 심사 서류의 제출 기한과 심사료 금액에 대한 정확한 일정을 확인할 수 없습니다."], "answers_b": ["- 교육대학원 심사료는 카카오 계좌 3333-08-2300151(성기동)로 납부할 수 있습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다.", "- 13(월), 석사 심사료는 10만원으로 기재된 내용이 확인됩니다."], "reasons_a": ["기준답안에 명시된 구체적인 제출 기한과 심사료 정보를 제공하지 않고 정보 확인 불가로 답변하여 질문에 대한 해결책을 제시하지 못함.", "기준답안에 명시된 핵심 정보(제출 기한 및 심사료)가 존재함에도 불구하고, 이를 확인할 수 없다고 답변하여 정보 제공에 실패했습니다.", "기준답안에 명시된 핵심 정보(제출 기한 및 심사료)가 존재함에도 불구하고, 이를 확인할 수 없다고 답변하여 질문에 대한 해결책을 전혀 제시하지 못했습니다."], "reasons_b": ["질문자가 요구한 제출 기한과 심사료 금액에 대한 정보가 전혀 포함되지 않았으며, 질문과 무관한 교육대학원 계좌 정보만 제시하였습니다.", "질문에 대한 구체적인 날짜와 금액 정보를 전혀 제공하지 않고 답변을 회피하여 핵심 사실이 모두 누락되었습니다.", "제출 기한에 대한 핵심 정보가 누락되었고, 박사 심사료 등 필수적인 정보가 빠져 있어 질문에 대한 답변으로서 불충분합니다."], "sources_a": [{"source_title": "부산대학교", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_44fef2347b42e365b0778083:cascade#0000"}, {"source_title": "부산대학교", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_0e594b11c71d2b3e77fc4b04:cascade#0000"}, {"source_title": "부산대학교", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_e8972d527ff0878755c54d5a:cascade#0000"}, {"source_title": "부산대학교", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_f4b3f405b54467b0557024f0:cascade#0000"}, {"source_title": "부산대학교", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_4f8c0f2c83b2f92c23f8b075:cascade#0000"}, {"source_title": "1.학위청구논문 심사계획일정 및 서류전체(2025 후기).hwp", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_d7c3ae81debc1aebe1fa9435:cascade#0018"}, {"source_title": "1.학위청구논문 심사계획일정 및 서류전체(2025 후기).hwp", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_d7c3ae81debc1aebe1fa9435:cascade#0022"}, {"source_title": "2024학년도 후기 교육대학원 논문일정 및 제출 서류.hwp", "source_host": "physicaledu.pusan.ac.kr", "chunk_id": "doc_45d33d5d7500b8bf 국인 석·박사 재학생, 휴학생, 수료생을 대상으로 대학원 학위청구 외국어시험(한국어) 대체강좌를 개설하고 있습니다.\n- 12.(금)까지 언어교육원 홈페이지에서 선착순으로 신청할 수 있습니다.\n- 대체강좌를 이수하려면 총 수업일수의 3분의 2 이상 출석하고, 출석 20%, 과제 30%, 시험 50%를 합산하여 70점 이상을 받아야 합니다.\n- 기준을 모두 충족하여 이수한 자에 한해 대학원 학위청구 외국어시험 면제 신청이 가능합니다.", "- 부산대학교에서는 대학원 외국인 석·박사 재학생, 휴학생, 수료생을 대상으로 대학원 학위청구 외국어시험(한국어) 대체강좌를 개설하고 있습니다.\n- 12.(금)까지 언어교육원 홈페이지에서 선착순으로 신청할 수 있습니다.\n- 이수 기준을 모두 충족해 이수한 자에 한해서만 대학원 학위청구 외국어시험 면제 신청이 가능합니다.", "- 부산대학교에서는 대학원 외국인 석·박사 재학생, 휴학생, 수료생을 대상으로 대학원 학위청구 외국어시험(한국어) 대체강좌를 개설하고 있습니다.\n- 12.(금)까지 언어교육원 홈페이지에서 선착순으로 신청할 수 있습니다.\n- 이수 기준을 모두 충족해 강좌를 이수한 자에 한해 대학원 학위청구 외국어시험 면제 신청이 가능합니다."], "answers_b": ["- 부산대학교에서는 외국인 대학원생을 위한 학위청구 외국어시험(한국어) 대체강좌를 개설하고 있습니다.\n- 수강 대상은 대학원 외국인 석·박사 재학생, 휴학생, 수료생입니다.\n- 신청 기간은 2026년 6월 4일부터 2026년 6월 12일까지이며 선착순으로 마감됩니다.\n- 신청 방법은 언어교육원 홈페이지에서 온라인으로 신청할 수 있습니다.\n- 총 수업일수의 3분의 2 이상 출석하고 출석, 과제, 시험을 합하여 70점 이상을 받으면 이수할 수 있으며 이수자에 한해 외국어시험 면제신청이 가능합니다.", "- 부산대학교에는 대학원 학위청구 외국어시험을 대체하기 위한 한국어 대체강좌가 개설되어 있습니다.\n- 대학원 외국인 석·박사 재학생, 휴학생, 수료생이 신청할 수 있으며, 2026학년도 여름학기 기준 신청 기간은 2026.\n- 신청 방법은 언어교육원 홈페이지에서 선착순 마감으로 진행되며, 증명서 제출자 또는 면접통과자의 수강 자격이 필요합니다.", "- 부산대학교에서는 대학원 외국인 석·박사 재학생, 휴학생, 수료생을 대상으로 대학원 학위청구 외국어시험(한국어) 대체강좌를 개설하고 있습니다.\n- 해당 대체강좌의 수강 대상은 대학원 외국인 석·박사 재학생, 휴학생, 수료생이며 수강 자격은 증명서 제출자 또는 면접통과자입니다.\n- 12.(금)까지이며 선착순으로 마감됩니다.\n- 신청 방법은 언어교육원 홈페이지에서 신청할 수 있습니다.\n- 총 수업일수의 3분의 2 이상 출석하고 출석, 과제, 시험을 합하여 70점 이상을 취득하여 이수하면 대학원 학위청구 외국어시험 면제신청을 할 수 있습니다."], "reasons_a": ["신청 기간의 시작일(6. 4.)이 누락되었고, 강의 기간 및 시간 등 구체적인 일정 정보가 부족하여 핵심 사실이 일부 누락되었습니다.", "신청 시작일과 강의 기간, 구체적인 이수 기준 등 핵심 수치와 정보가 다수 누락되어 정보 전달력이 부족합니다.", "신청 시작일과 구체적인 강의 일정, 이수 기준 등 핵심 수치와 정보가 다수 누락되어 정보 전달력이 부족합니다."], "reasons_b": ["기준답안의 핵심 수치와 이수 조건이 모두 정확하게 포함되었으며, 추가된 신청 방법 정보는 사실과 모순되지 않아 감점 요인이 없습니다.", "신청 기간이 중간에 끊겨 불완전하며, 기준답안에 없는 '증명서 제출자 또는 면접통과자'라는 잘못된 수강 자격 조건을 제시하였습니다.", "신청 기간의 시작일이 누락되었고, 기준답안에 없는 '증명서 제출자 또는 면접통과자'라는 수강 자격 조건을 임의로 추가하여 정보의 정확성이 떨어짐."], "sources_a": [{"source_title": "2026학년도 여름학기 대학원 학위청구 외국어시험(한국어) 대체강좌 수강생 모집.pdf", "sourc _a": 0, "mean_b": 0, "delta_b_minus_a": 0, "retrieval_hit_a": false, "retrieval_hit_b": false, "rank_a": null, "rank_b": null, "evidence_hit_a": false, "evidence_hit_b": false, "sources_changed": true, "query": "부산대는 학생증 발급이나 증명서 발급 같은 업무를 외부 기관에 위탁하고 있나요? 어디에 맡기나요?", "reference": "부산대학교는 개인정보 처리가 수반되는 일부 업무를 외부에 위탁하고 있습니다. 학생처 학생과의 학생증발급업무는 KEB하나은행 온천장역지점이, 교육혁신본부의 전자증명 시스템을 통한 각종 증명서 발급은 ㈜아이앤텍이 수탁기관입니다. 이 밖에 입학처 입학과의 원서접수는 ㈜진학어플라이(대교협), 국제처의 외국인 유학생 보험 가입은 DB손해보험에 위탁되어 있습니다.", "answers_a": ["검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다.", "검색 결과는 있으나 답변 문장을 지지하는 근거를 충분히 확인하지 못했습니다."], "answers_b": ["제공된 검색 근거에서 질문에 답할 내용을 확인할 수 없습니다.", "- 제공된 문서에서 학생증이나 증명서 발급 업무를 외부 기관에 위탁하고 있는지 여부와 위탁 기관에 대한 구체적인 내용을 확인할 수 없습니다.", "- 제공된 문서에서 부산대학교가 학생증 발급이나 증명서 발급 업무를 외부 기관에 위탁하는지에 대한 구체적인 내용을 확인할 수 없습니다."], "reasons_a": ["질문자가 요구한 학생증 및 증명서 발급 위탁 기관에 대한 구체적인 정보를 전혀 제공하지 못하고 답변을 회피했기 때문입니다.", "질문자가 요구한 학생증 및 증명서 발급 위탁 기관에 대한 구체적인 정보를 전혀 제공하지 못하고 답변을 회피했기 때문입니다.", "질문자가 요구한 학생증 및 증명서 발급 위탁 기관에 대한 구체적인 정보를 전혀 제공하지 못하고 답변을 회피했기 때문입니다."], "reasons_b": ["기준답안에 명시된 위탁 기관 및 업무 내용이 존재함에도 불구하고, 정보를 확인할 수 없다고 답변하여 질문에 대한 답변을 전혀 수행하지 못했습니다.", "질문에서 요구한 학생증 및 증명서 발급 위탁 기관에 대한 정보를 전혀 제공하지 못하고 사실과 다른 답변을 제시하였습니다.", "질문에서 요구한 학생증 및 증명서 발급 위탁 기관에 대한 정보를 전혀 제공하지 못하고, 오히려 정보가 없다고 잘못된 답변을 제시함."], "sources_a": [{"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0006"}, {"source_title": "국문(Korean)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_c9d11e1cb6508c6836e2f555:cascade#0007"}, {"source_title": "국문(Korean)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_af1dc957d92e2fbc2fb12e45:cascade#0007"}, {"source_title": "국문(Korean)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_c88aba03e6e1b75860efffe2:cascade#0008"}, {"source_title": "국문(Korean)", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_0b3c652f2eb3bbc9fd295946:cascade#0008"}, {"source_title": "붙임3. 2026년도 쌍용곰두리장학생 FA 칙에서 정한 졸업 소요 학점을 취득하면 졸업할 수 있습니다. 일반편입학은 공인영어시험(토익, 토플, 텝스 중 택1) 공식성적이 필수이고, 전문학사 학위 취득(예정)자 또는 4년제 대학에서 2학년(4개 학기) 이상 수료(예정)한 사람 등의 자격이 필요합니다. 편입학전형은 1회만 지원 가능하며 일반편입과 학사편입 간 중복 지원은 할 수 없습니다.", "answers_a": ["- 부산대학교에 일반편입학으로 합격하면 3학년 1학기로 편입하게 됩니다.\n- 일반편입학 지원자격은 공인영어시험에 응시하여 공식 성적을 취득한 사람이어야 합니다.\n- 국내외 대학에서 전문 학사학위를 취득하거나 4년제 대학에서 2학년 이상 수료한 사람이 지원할 수 있습니다.\n- 학점인정 등에 관한 법률 및 평생교육법에 의하여 전문학사 이상 학위를 취득한 사람도 지원이 가능합니다.\n- 학사학위 과정의 경우 취득한 학점이 80학점 이상인 사람도 지원할 수 있습니다.", "- 부산대학교에 일반편입학으로 합격하면 3학년 1학기로 편입하게 됩니다.\n- 일반편입학 지원 자격은 공인영어시험에 응시하여 성적을 취득한 사람이어야 합니다.\n- 국내외 대학에서 전문 학사학위를 취득하거나 4년제 대학에서 2학년 이상 수료한 사람이 지원할 수 있습니다.\n- 학점인정 등에 관한 법률 및 평생교육법에 따라 전문학사 이상 학위를 취득한 사람도 지원 가능합니다.\n- 동법에 의한 학사학위 과정의 경우 취득한 학점이 80학점 이상이어야 지원할 수 있습니다.", "- 부산대학교 일반편입에 합격하면 3학년 1학기로 편입됩니다.\n- 일반편입 지원자격은 토익, 토플, 텝스 중 택1하여 공식 성적을 취득한 필수자격이 필요합니다.\n- 국내외 대학에서 전문 학사학위를 취득하거나 4년제 대학에서 2학년 이상 수료한 사람이 지원할 수 있습니다.\n- 학점인정 등에 관한 법률 및 평생교육법에 따라 전문학사 이상 학위를 취득한 사람도 지원할 수 있습니다.\n- 학사학위 과정의 경우 취득한 학점이 80학점 이상인 사람도 지원 자격을 충족합니다."], "answers_b": ["- 부산대학교에 일반편입을 하면 3학년 1학기로 편입됩니다.\n- 일반편입학 지원자격은 공인영어시험에 응시하여 공식성적을 취득한 사람입니다.\n- 또한 국내외 대학에서 전문 학사학위 취득(예정)자이거나 4년제 대학에서 2학년 이상 수료(예정)한 사람 등이 지원할 수 있습니다.\n- 학점인정 등에 관한 법률 및 평생교육법에 의하여 전문학사 이상 학위를 취득(예정)한 사람도 지원 가능합니다.", "- 부산대에 일반편입을 하면 3학년 1학기로 편입됩니다.\n- 공인영어시험에 응시하여 공식성적을 취득한 사람이 지원할 수 있습니다.\n- 국내외 대학에서 전문 학사학위 취득(예정)자 또는 4년제 대학에서 2학년(4개 학기) 이상 수료(예정)한 사람이 지원 가능합니다.\n- 학점인정 등에 관한 법률 및 평생교육법에 의해 전문학사 이상 학위를 취득(예정)했거나 학사과정 80학점 이상 취득한 사람도 지원할 수 있습니다.", "- 부산대학교에 일반편입학으로 합격하면 3학년 1학기로 편입하게 됩니다.\n- 일반편입학 지원 자격은 공인영어시험에 응시하여 공식 성적을 취득해야 합니다.\n- 국내외 대학에서 전문 학사학위 취득(예정)자이거나 4년제 대학에서 2학년 이상 수료(예정)한 사람이어야 합니다.\n- 학점인정 등에 관한 법률 및 평생교육법에 의해 전문학사 이상 학위를 취득(예정)한 사람도 지원할 수 있습니다.\n- 학사학위 과정의 경우 취득한 학점이 80학점 이상인 사람이 지원 자격을 충족합니다."], "reasons_a": ["3학년 편입 및 주요 지원 자격은 정확히 기술했으나, 기준답안에 명시된 '편입학전형 1회 지원 제한 및 중복 지원 불가'에 대한 안내가 누락되었습니다.", "일반편입과 학사편입 간 중복 지원 불가 및 1회 지원 제한이라는 핵심적인 지원 제한 조건을 누락하였습니다.", "기준답안의 핵심 내용인 편입 학년과 지원 자격(공인영어성적, 학력 요건)을 모두 정확하게 포함하고 있습니다."], "reasons_b": ["일반편입과 학사편입 간 중복 지원 불가 및 1회 지원 제한이라는 핵심적인 지원 제한 조건을 누락하였습니다.", "일반편입과 학사편입 간 중복 지원 불가 및 1회 지원 제한이라는 핵심적인 지원 제한 사항이 누락되었습니다.", "기준답안의 핵심 내용인 편입 학년과 지원 자격(공인영어, 학력 요건)을 모두 정확하게 포함하고 있으며, 추가된 내용도 사실과 모순되지 않음."], "sources_a": [{"source_title": "2026학년도 편입학 전형 FAQ.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_c0c57469256cd45dee604dce:cascade#0001"}, {"source_title": "2026학년도 편입학 전형 FAQ.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_c0c57469256cd45dee604dce:cascade#0002"}, {"source_title": "2026학년도 편입학전형 기본계획(변경_공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9145e3a6613111914da008fd:cascade#0043"}, {"source_title": "2026학년도 편입학전형 기본계획(변경_공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9145e3a6613111914da008fd:cascade#0013"}, {"source_title": "2026학년도 편입학전형 모집요강(홈페이지공고용).hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_fdaaf27f07037f06a7eba538:cascade#0020"}, {"source_title": "2026학년도 편입학전형 모집요강(홈페이지공고용).hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_fdaaf27f07037f06a7eba538:cascade#0009"}, {"source_title": "2027학년도 재외국민특별전형 모집요강_공고용.pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_2f849217190621e22bcb659a:cascade#0027"}, {"source_title": "2027학년도 재외국민특별전형 모집요강_배포용.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_3c59e715335a72d4f54da44d:cascade#0022"}], "sources_b": [{"source_title": "2026학년도 편입학전형 기본계획(변경_공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9145e3a6613111914da008fd:cascade#0043"}, {"source_title": "2026학년도 편입학 전형 FAQ.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_c0c57469256cd45dee604dce:cascade#0001"}, {"source_title": "2026학년도 편입학전형 기본계획(변경_공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9145e3a6613111914da008fd:cascade#0013"}, {"source_title": "2026학년도 편입학전형 모집요강(홈페이지공고용).hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_fdaaf27f07037f06a7eba538:cascade#0020"}, {"source_title": "2026학년도 편입학전형 모집요강(홈페이지공고용).hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_fdaaf27f07037f06a7eba538:cascade#0009"}, {"source_title": "2026학년도 편입학 전형 FAQ.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_c0c57469256cd45dee604dce:cascade#0002"}, {"source_title": "2027학년도 재외국민특별전형 모집요강_공고용.pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_2f849217190621e22bcb659a:cascade#0027"}, {"source_title": "2027학년도 재외국민특별전형 모집요강_배포용.hwp", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_3c59e715335a72d4f54da44d:cascade#0022"}]}, {"id": "svc_adm_02", "category": "admissions", "role": null, "scores_a": [0, 0, 0], "scores_b": [1, 1, 1], "mean_a": 0, "mean_b": 1, "delta_b_minus_a": 1, "retrieval_hit_a": false, "retrieval_hit_b": true, "rank_a": null, "rank_b": 4, "evidence_hit_a": false, "evidence_hit_b": true, "sources_changed": true, "query": "수시모집에 합격했는데 등록금은 언제까지 어떻게 내야 하나요?", "reference": "수시모집 합격자는 학생지원시스템에서 등록금 고지서를 2026. 2. 3.(화) 10:00부터 출력할 수 있고, 납부기간은 2026. 2. 3.(화) 10:00 ~ 2. 5.(목) 16:00입니다. 납부기간 내 등록금을 납부하지 않으면 합격하였더라도 등록을 포기한 것으로 처리됩니다. 전액 장학생이어도 고지서상 납입금액인 학생의료공제회비 3,000원을 납부해야 등록이 완료됩니다.", "answers_a": ["- 수시모집 합격자는 등록 기간 내에 온라인 문서등록과 함께 지정된 기간에 등록금을 납부해야 합니다.\n- 등록금 납부 기간은 2027년 2월 10일 10시부터 2027년 2월 12일 16시까지입니다.\n- 등록금을 납부하지 않으면 합격하였으나 등록을 포기한 것으로 처리됩니다.\n- 온라인 문서등록을 완료하더라도 정해진 등록금 납부 기간 내에 반드시 등록금을 납부해야 합니다.", "- 수시모집 합격자는 등록기간 내에 온라인 문서등록과 등록금 납부를 완료해야 합니다.\n- 등록금 납부 기간은 2027년 2월 10일 10시부터 2월 12일 16시까지입니다.", "- 수시모집에 합격한 학생은 온라인 문서등록 완료 후 2027년 2월 10일 10시부터 2027년 2월 12일 16시까지 등록금을 납부해야 합니다."], "answers_b": ["- 제공된 문서에 따르면 수시모집 합격자는 2026년 2월 3일 10시부터 2월 5일 16시까지 등록금을 납부해야 합니다.\n- 대상 및 자격은 수시모집 합격자이며, 납부기간은 2026.\n- 5.(목) 16:00 (매일 은행업무 시간 내)입니다.\n- 신청 경로 및 단계는 학생지원시스템에 로그인하여 고지서를 출력한 뒤 납부하는 방식으로 진행됩니다.\n- 제출 서류는 고지서상의 가상계좌 이체 또는 은행창구 방문을 통한 현금 납부로 진행됩니다.", "- 제공된 문서에 따르면, 수시모집 합격자의 등록금 납부기간은 2026년 2월 3일 10시부터 2월 5일 16시까지입니다.\n- 고지서 출력은 2026년 2월 3일 10시부터 학생지원시스템에서 가능합니다.\n- 납부 방법은 학생 개인별 가상계좌 입금 또는 은행 창구 방문을 통한 현금 납부입니다.\n- 전액 장학생의 경우에도 학생의료공제회비를 납부해야 정식 등록이 완료됩니다.", "- 제공된 문서에 따르면, 수시모집 합격자의 등록금 납부기간은 202  전학년 여학생 및 SAM 분야 재적생이며, 학생역량지원시스템의 비교과프로그램에서 희망 과정을 선택해 신청합니다. 과정별 모집인원은 30명이고 신청기간은 2026. 7. 27.(월) 00:00 ~ 8. 4.(화) 17:00입니다.", "answers_a": ["- 부산대학교에서는 데이터분석준전문가 및 AI프롬프트활용능력 자격증 취득을 위한 2026학년도 1차 취업 Skill UP 프로그램 특강을 운영합니다.\n- 신청 대상은 본교 대학(원) 전학년 여학생 및 SAM 분야 재적생이며 선발기준은 기준에 따른 선착순 선발입니다.\n- AI프롬프트 활용 능력 과정의 신청기간은 2026.\n- 신청 경로는 학생역량지원시스템, 비교과활동, 비교과프로그램, [2026학년도 1차 취업 Skill UP 프로그램] 희망 과정 선택 순으로 진행합니다.", "- 데이터분석준전문가(ADsP)와 AI프롬프트활용능력(AI-POT) 자격증 취득을 지원하는 2026학년도 1차 취업 Skill UP 프로그램 특강이 운영됩니다.\n- 신청 대상은 본교 대학(원) 전학년 여학생 및 SAM 분야 재적생이며, SAM 분야는 인문대학, 사회과학대학, 자연과학대학, 생활과학대학, 예술대학입니다.\n- 신청 경로 및 단계는 학생역량지원시스템, 비교과활동, 비교과프로그램, 2026학년도 1차 취업 Skill UP 프로그램 희망 과정 선택 순입니다.\n- 선발 기준은 4학년 재적생 및 차기시험 참여희망자를 우선 선발하는 기준에 따른 선착순 선발입니다.", "- 데이터분석 자격증과 AI 활용 능력을 준비할 수 있는 2026학년도 1차 취업 Skill UP 프로그램이 운영됩니다.\n- 신청대상은 본교 대학(원) 전학년 여학생 및 SAM 분야 재적생이며 선착순으로 선발합니다.\n- 신청기간은 AI프롬프트 활용 능력 과정의 경우 2026.\n- 신청경로는 학생역량지원시스템, 비교과활동, 비교과프로그램 순으로 이동하여 희망 과정을 선택하면 됩니다."], "answers_b": ["- 부산대학교에서는 데이터분석준전문가 및 AI프롬프트활용능력 교육 특강을 운영합니다.\n- 본교 대학 및 대학원 전 학년 여학생 및 SAM 분야 재적생이 신청할 수 있습니다.\n- 신청 방법은 학생역량지원시스템에서 비교과활동, 비교과프로그램 순으로 이동하여 희망 과정을 선택하면 됩니다.", "- 부산대학교 취업전략과에서 데이터분석준전문가(ADsP) 및 AI프롬프트활용능력(AI-POT) 자격증 취득 과정을 운영합니다.\n- 본교 대학(원) 전학년 여학생 및 SAM 분야 재적생이 지원할 수 있으며 기준에 따른 선착순으로 선발합니다.\n- 신청방법은 학생역량지원시스템에서 비교과활동, 비교과프로그램 순으로 이동하여 2026학년도 1차 취업 Skill UP 프로그램 희망 과정을 선택하면 됩니다.", "- 부산대학교에서는 데이터분석준전문가 및 AI프롬프트활용능력 자격증 취득을 지원하는 2026학년도 1차 취업 Skill UP 프로그램을 운영합니다.\n- 신청 대상은 본교 대학원 전 학년 여학생 및 SAM 분야 재적생이며, 4학년 재적생 및 차기시험 참여 희망자를 우선 선발합니다.\n- 신청 기간은 AI프롬프트 활용 능력 과정이 2026년 7월 27일 00:00부터 8월 4일 17:00까지입니다.\n- 신청 경로 및 단계는 학생역량지원시스템, 비교과활동, 비교과프로그램, 2026학년도 1차 취업 Skill UP 프로그램에서 희망 과정을 선택하면 됩니다."], "reasons_a": ["신청 기간이 중간에 끊겨 정보가 누락되었고, 모집 인원 정보가 빠져 있으나 핵심적인 프로그램 내용과 신청 대상 및 경로는 정확히 안내함.", "기준답안에 명시된 모집인원(30명)과 신청기간(7.27~8.4) 정보가 누락되었으며, 기준답안에 없는 선발 기준(4학년 우선 선발 등)이 추가되어 정확성이 다소 부족함.", "신청 기간이 명시되지 않고 중간에 끊겼으며, 모집 인원 정보가 누락되었으나 프로그램 운영 및 신청 대상, 경로 등 핵심 정보는 포함되어 있습니다."], "reasons_b": ["핵심 사실인 모집 인원과 신청 기간(날짜 및 시간) 정보가 누락되었습니다.", "핵심 수치인 모집 인원(30명)과 신청 기간(7.27~8.4)이 누락되었으며, 기준답안에 없는 '선착순 선발'이라는 내용을 임의로 추가하였습니다.", "신청 대상에서 '대학(원) 전학년 여학생'을 '대학원 전 학년 여학생'으로 잘못 기재하여 대상 범위가 축소되었고, 기준답안에 없는 우선 선발 기준이 포함되어 있습니다."], "sources_a": [{"source_title": "2026학년도 취업 Skill UP 프로그램(1차) 실시 안내.pdf (213KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_0a72b06d14efb1fbf0182b93:cascade#0000"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_2757dab53bc3f768ec8e2766:cascade#0006"}, {"source_title": "2026학년도 1차 취업 Skill Up (AI-POT과정 & ADsP과정) 프로그램 모집 안내 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_acd1775a787ac3229222344c:cascade#0018"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_2757dab53bc3f768ec8e2766:cascade#0005"}, {"source_title": "2026학년도 1차 취업 Skill Up (AI-POT과정 & ADsP과정) 프로그램 모집 안내 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_acd1775a787ac3229222344c:cascade#0017"}, {"source_title": "2026학년도 취업 Skill UP 프로그램(1차) 실시 안내.pdf (213KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_0a72b06d14efb1fbf0182b93:cascade#0006"}, {"source_title": "ITQ 엑셀,한글,파워포인트 취업사무직 자격증 단기반 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_b0a2df1491bedad577450689:cascade#0020"}, {"source_title": "IT 직무 프리뷰 – 데이터분석가편 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_8287e7d03d94c530f1c4543c:cascade#0017"}], "sources_b": [{"source_title": "2026학년도 취업 Skill UP 프로그램(1차) 실시 안내.pdf (213KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_0a72b06d14efb1fbf0182b93:cascade#0000"}, {"source_title": "2026학년도 1차 취업 Skill Up (AI-POT과정 & ADsP과정) 프로그램 모집 안내 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_acd1775a787ac3229222344c:cascade#0018"}, {"source_title": "2026학년도 1차 취업 Skill Up (AI-POT과정 & ADsP과정) 프로그램 모집 안내 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_acd1775a787ac3229222344c:cascad 있는 진로부트캠프(온라인) 프로그램이 있습니다.\n- 전체 학과(부) 1~3학년 재학생이 지원할 수 있으며 휴학생과 2025학년도 진로부트캠프 미수료자는 제외됩니다.\n- 신청 방법은 학생역량지원시스템에서 비교과활동, 비교과프로그램 순으로 진로부트캠프를 검색하여 신청하면 됩니다.\n- 문의처는 학생처 취업전략과(051-510-3701)입니다."], "answers_b": ["- 부산대학교 취업전략과에서는 진로를 아직 정하지 못한 학생들을 위해 여러 직무를 탐색하고 경험할 수 있는 진로부트캠프 프로그램을 운영합니다.\n- 모집 대상은 전체 학과 1~3학년 재학생이며 휴학생과 2025학년도 진로부트캠프 미수료자는 제외됩니다.\n- 신청 경로는 학생역량지원시스템에서 비교과활동, 비교과프로그램 순으로 접속한 뒤 진로부트캠프를 검색하여 신청할 수 있습니다.\n- 문의 사항은 학생처 취업전략과로 연락하면 됩니다.", "- 부산대학교 취업전략과에서는 진로를 정하지 못한 학생들이 여러 직무를 제한 없이 탐색하고 경험할 수 있도록 2026학년도 1차 진로부트캠프(온라인) 프로그램을 운영합니다.\n- 모집대상은 전체 학과(부) 1~3학년 재학생이며 휴학생과 2025학년도 진로부트캠프 미수료자는 제외됩니다.\n- 신청방법은 학생역량지원시스템의 비교과활동, 비교과프로그램 메뉴에서 진로부트캠프를 검색하여 신청할 수 있습니다.\n- 문의사항은 학생처 취업전략과 전화번호 051-510-3701로 문의하시기 바랍니다.", "- 진로를 정하지 못한 학생들은 2026학년도 1차 진로부트캠프(온라인) 프로그램을 통해 여러 직무를 제한 없이 탐색하고 체험할 수 있습니다.\n- 모집대상은 전체 학과(부) 1~3학년 재학생이며 휴학생과 2025학년도 진로부트캠프 미수료자는 제외됩니다.\n- 신청방법은 학생역량지원시스템에서 비교과활동, 비교과프로그램, 진로부트캠프 순서로 검색한 후 신청하면 됩니다.\n- 자세한 문의는 학생처 취업전략과(051-510-3701)로 하시기 바랍니다."], "reasons_a": ["프로그램의 운영 기간 및 신청 기간 등 핵심 수치가 누락되었으며, 기준답안에 없는 휴학생 및 이전 연도 미수료자 제외 조건을 언급하여 정보의 정확성이 다소 부족함.", "진로부트캠프라는 프로그램 안내는 적절하나, 모집 인원, 운영 기간, 신청 기간 등 핵심 수치 정보가 모두 누락되었고 기준답안에 없는 휴학생 및 미수료자 제외 조건이 포함되어 있습니다.", "기준답안에 명시된 모집 인원, 운영 기간, 신청 기간 등 핵심 수치가 누락되었으며, 기준답안에 없는 휴학생 및 미수료자 제외 조건을 언급하여 정보의 정확성이 다소 부족함."], "reasons_b": ["진로부트캠프 프로그램에 대한 안내는 적절하나, 기준답안에 명시된 구체적인 모집 인원, 신청 기간, 운영 기간 등 핵심 수치 정보가 모두 누락되었습니다.", "기준답안에 명시된 모집 인원, 신청 기간, 운영 기간 등 핵심 수치가 누락되었으며, 기준답안에 없는 휴학생 및 이전 수료자 제외 조건이 추가되어 정보의 정확성이 다소 부족함.", "기준답안에 없는 '휴학생 및 전년도 미수료자 제외'라는 조건을 추가하여 사실관계를 왜곡했고, 프로그램 운영 기간 및 모집 인원 등 핵심 수치 정보가 누락되었습니다."], "sources_a": [{"source_title": "부산대학교", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_0ef4529f7859b9690cd3d4b1:cascade#0003"}, {"source_title": "[취업전략과] 2026학년도 1차 진로부트캠프(온라인) 모집 안내 - 부산대 취업전략과", "source_host": "job.pusan.ac.kr", "chunk_id": "doc_d17602c3f7e0f1f7099b81ff:cascade#0017"}, {"source_title": "2026년 하반기 WEST 참가자 모집 공고문.pdf (1MB)", "source_host": "www.pusan.ac.kr", "c ": "student_support", "role": null, "scores_a": [2, 0, 2], "scores_b": [2, 2, 2], "mean_a": 1.3333333333333333, "mean_b": 2, "delta_b_minus_a": 0.6666666666666667, "retrieval_hit_a": false, "retrieval_hit_b": false, "rank_a": null, "rank_b": null, "evidence_hit_a": false, "evidence_hit_b": false, "sources_changed": true, "query": "장애가 있는 학생인데 수업이나 시험에서 어떤 지원을 받을 수 있나요?", "reference": "부산대학교는 2004년 장애학생지원센터를 설립하여 장애학생을 지원하고 있습니다. 교수·학습 지원으로 학습보조 기자재 대여, 대필지원과 시험시간에 확대 시험지 제공 및 시험 시간 연장 등의 강의지원, 점자교재 등 교재지원을 제공합니다. 또한 수강신청 전날 우선적으로 수강신청이 가능하고, 튜터링과 학습도우미 지원도 받을 수 있습니다.", "answers_a": ["- 제공된 문서에서 장애가 있는 학생이 받을 수 있는 수업 및 시험 지원 내용을 확인할 수 있습니다.\n- 우선 수강신청을 통해 정보 접근 어려움과 과제 처리 시간 소요를 줄일 수 있도록 지원합니다.\n- 교수자를 위한 장애학생 학습 지원과 점자교재, 교재확대, 속기통역교재, 수화통역교재 등의 강의자료 제작을 지원합니다.\n- 학습 상담 및 전공·선택 교양과목에 해당하는 교육지원인력과 강의실 좌석 우선 배정 및 장애학생 배려석을 지원합니다.\n- 평가 지원으로는 과제 제출이나 시험에서의 제출 기간 및 시험시간 연장, 별도의 시험장소, 교육지원인력 및 보조공학기기 등을 지원합니다.", "- 제공된 문서에서 장애가 있는 학생에 대한 지원 내용을 확인할 수 있습니다.", "- 제공된 문서에서 장애가 있는 학생이 받을 수 있는 수업 및 시험 지원 내용을 확인할 수 있습니다.\n- 우선 수강신청을 지원하며, 교수자를 위한 장애학생 학습 지원과 점자교재, 교재확대, 속기통역교재, 수화통역교재 등의 강의자료 제작을 지원합니다.\n- 상시 학습 상담 및 전공과 선택 교양과목에 해당하는 학습 교육지원인력을 지원받을 수 있습니다.\n- 평가 지원으로 과제 제출이나 시험에서의 제출 기간 및 시험시간 연장, 별도의 시험장소 제공, 교육지원인력과 보조공학기기를 지원합니다.\n- 강의실 좌석 우선 배정과 이동이 불편한 학생을 위한 장애학생 배려석 지정 및 접근 지원을 받을 수 있습니다."], "answers_b": ["- 장애학생은 수강신청 과정에서 우선 수강신청 지원과 강의실 좌석 우선 배정 및 접근 지원을 받을 수 있습니다.\n- 교수자가 장애학생의 특성을 고려하여 학습 지도할 수 있도록 지원하며, 점자교재 등 접근이 용이한 강의자료를 제작해 줍니다.\n- 학습이 어려운 학생을 위해 상시 학습 상담과 전공 및 선택 교양과목에 해당하는 학습 교육지원인력 지원을 제공합니다.\n- 과제 제출이나 시험에서 제출 기간 및 시험시간 연장, 별도의 시험장소 제공, 시험감독 및 보조공학기기 등의 평가 지원을 받을 수 있습니다.\n- 대면수업 및 원격수업에 필요한 장애유형별 보조공학기기와 일반 및 전문교육지원인력 지원도 함께 이용할 수 있습니다.", "- 장애학생은 수강신청 과정에서 우선 수강신청을 지원받을 수 있습니다.\n- 수업 환경에서는 점자교재나 수화통역교재 같은 강의자료 제작 지원을 받을 수 있습니다.\n- 평가 과정에서는 시험시간 연장이나 별도의 시험장소 제공 같은 평가 지원을 받을 수 있습니다.\n- 또한 학습 활동을 위한 교육지원인력과 보조공학기기를 지원받을 수 있습니다.", "- 장애학생은 수강신청, 수업, 평가, 강의실 배정 등 다양한 영역에서 학습 지원을 받을 수 있습니다.\n- 우선 수강신청을 지원받을 수 있으며 점자교재, 교재확대 등의 강의자료 제작 지원이 제공됩니다.\n- 학습 상담, 교육지원인력 지원, 보조공학기기 대여 서비스도 이용할 수 있습니다.\n- 평가 지원으로는 제출 기간 및 시험시간 연장, 별도의 시험장소 제공, 교육지원인력 및 보조공학기기 지원이 이루어집니다.\n- 강의실 좌석 우선 배정과 강의실 우선 배정으로 이동 편의도 제공됩니다."], "reasons_a": ["기준답안의 핵심 지원 내용(수강신청, 학습 및 교재 지원, 시험 지원 등)을 모두 포함하고 있으며, 추가된 내용 또한 사실과 모순되지 않습니다.", "장애 학생을 위한 구체적인 지원 내용(학습 보조, 시험 편의, 우선 수강신청 등)이 전혀 언급되지 않아 정보 제공의 역할을 수행하지 못했습니다.", "기준답안의 핵심 내용인 학습 지원, 시험 지원, 우선 수강신청 등을 모두 포함하고 있으며, 추가된 내용 또한 사실과 모순되지 않아 정확한 정보를 제공함."], "reasons_b": ["기준답안의 핵심 내용인 우선 수강신청, 학습보조 기자재, 대필 및 학습도우미, 시험 시간 연장 및 확대 시험지 제공 등의 지원 사항을 모두 포괄하고 있으며, 추가된 내용 또한 사실과 모순되지 않습니다.", "기준답안의 핵심 지원 내용들을 모두 포함하고 있으며, 추가된 내용 또한 사실과 모순되지 않아 정확한 정보를 제공함.", "기준답안의 핵심 지원 내용(수강신청, 학습보조, 시험 지원 등)을 모두 포함하고 있으며, 추가된 내용 또한 사실과 모순되지 않음."], "sources_a": [{"source_title": "인권 및 성폭력 상담 가이드북(내담자용).pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_c2692578bc9aed14894f48b6:cascade#0077"}, {"source_title": "[PDF]2027학년도 학생부위주전형 가이드북", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9800bc1c38aa5666e76d3bac:cascade#0241"}, {"source_title": "인권 및 성폭력 상담 가이드북(내담자용).pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_c2692578bc9aed14894f48b6:cascade#0070"}, {"source_title": "2026년 하반기 WEST 참가자 모집 공고문.pdf (1MB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_f74f8fe28799f6d02d5e9567:cascade#0078"}, {"source_title": "부산대학교 입학처에 오신걸 환영합니다.", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_ac79d493fe7bfee6777879a9:cascade#0002"}, {"source_title": "재학생 등록금 관련 자주하는 질문(FAQ) 안내.pdf (146KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_42a5d988dc5b54ee5c5759f2:cascade#0000"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0004"}, {"source_title": "2026학년도 재외국민특별전형 모집요강(공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9cb4764f364ffedb798653c7:cascade#0236"}], "sources_b": [{"source_title": "2026학년도 재외국민특별전형 모집요강(공고용).pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9cb4764f364ffedb798653c7:cascade#0236"}, {"so  구글폼 접수 페이지에 첨부 후 제출하는 방식으로 진행됩니다.\n- 지자체에 자부담금 납부 후 증빙자료 검토 및 전액 지원 방식으로 진행되며, 문의처는 한국주택금융공사 콜센터 및 한국장애인단체총연맹 메일입니다.", "- 과학기술정보통신부 정보통신보조기기 보급 활성화 사업 최종 선정자 중 장애대학(원)생은 장애학생 성장 자립 지원사업을 통해 자부담금을 전액 지원받을 수 있습니다.\n- 지원대상은 과학기술정보통신부 2026년 정보통신보조기기 보급 활성화 사업 최종 선정자 중 장애대학(원)생입니다.\n- 신청방법은 구글폼 접수 페이지에 첨부 후 제출하는 방식으로 진행됩니다.\n- 지자체에 자부담금을 먼저 납부한 뒤 증빙자료 검토를 거쳐 지원하며, 문의는 한국주택금융공사 콜센터와 한국장애인단체총연맹 메일로 할 수 있습니다."], "answers_b": ["- 과학기술정보통신부의 정보통신보조기기 보급 활성화 사업에 선정되어 자부담금을 납부한 뒤 납부 증빙자료 확인을 거쳐 자부담금을 지원받을 수 있습니다.\n- 지원대상은 과학기술정보통신부의 2026년 정보통신보조기기 보급 활성화 사업에 신청하여 최종 선정된 장애학생입니다.\n- 본 사업은 자부담금을 먼저 납부한 뒤 납부 증빙자료 확인을 거쳐 자부담금을 지원하는 방식으로 진행되며 기기 수령확인서 제출은 지원 후 요청할 예정입니다.", "- 과학기술정보통신부의 정보통신보조기기 보급 활성화 사업에 최종 선정된 장애학생은 자부담금 전액을 지원받을 수 있습니다.\n- 지원대상은 과학기술정보통신부 2026년 정보통신보조기기 보급 활성화 사업에 신청하여 최종 선정된 장애학생입니다.\n- 지원 절차는 정보통신보조기기 보급 활성화 사업 선정자가 자부담금을 먼저 납부한 뒤, 납부 증빙자료 확인을 거쳐 자부담금을 지원받는 방식으로 진행됩니다.\n- 제공된 문서에서 기기 수령확인서는 지원 후 요청할 예정이라고 확인되며, 예외 조건이나 문의처에 대한 내용은 확인할 수 없습니다.", "- 정보통신보조기기 보급사업 선정자는 장애학생 성장 자립 지원사업(정보통신보조기기 보급 자부담금 지원사업)을 통해 자부담금을 전액 지원받을 수 있습니다.\n- 지원 대상은 과학기술정보통신부 2026년 정보통신보조기기 보급 활성화 사업에 신청하여 최종 선정된 초등학생, 중학생, 고등학생, 전공과 학생, 대학생, 대학원생 장애학생입니다.\n- 신청 기간은 2026년 7월 16일 목요일부터 8월 13일 목요일까지입니다.\n- 본 사업은 선정자가 자부담금을 먼저 납부한 뒤, 납부 증빙자료 확인을 거쳐 자부담금을 지원하는 방식으로 진행되며 기기 수령확인서 제출은 지원 후 요청할 예정입니다."], "reasons_a": ["지원 대상에 '장애대학원생'으로 한정하는 등 기준답안에 없는 조건을 추가하였고, 신청 기간 및 구체적인 제출 서류 목록이 누락되었습니다.", "지원 대상에 '장애대학원생'이라는 제한을 추가했고, 문의처에 사실과 다른 기관을 기재하였으며 신청 기간 등 핵심 정보가 누락되었습니다.", "자부담금 전액 지원이라는 결론은 정확하나, 신청 기간과 필수 제출 서류 등 핵심 정보가 누락되었으며 문의처에 사실과 다른 정보가 포함되었습니다."], "reasons_b": ["자부담금 지원이라는 결론은 정확하나, 신청 기간과 구체적인 제출 서류 등 핵심 정보가 누락되었습니다.", "자부담금 지원이라는 결론은 정확하나, 신청 기간과 필수 제출 서류 등 핵심적인 행정 정보가 누락되었습니다.", "핵심 사실인 신청 방법(구글폼)과 제출 서류 목록이 누락되었으며, 기준답안에 없는 기기 수령확인서 관련 내용을 추가하여 정보의 완전성이 다소 부족함."], "sources_a": [{"source_title": "[붙임 1] 장애학생 성장 자립 지원사업(정보통신보조기기 보급 자부담금 지원사업) 신청 안내문.hwpx", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_def2efd3bed70cdd221ae886:cascade#0010"}, {"source_title": "부산대학교", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_47ccbf86674534c30e927d4e:cascade#0001"}, {"source_title": "[붙임 1] 장애학생 성장 자립 지원사업(정보통신보조기기 보급 자부담금 지원사업) 신청 안내문.hwpx", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_def2efd3bed70cdd221ae886:cascade#0002"}, {"source_title": "부산대학교 장애학생지원센터", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_240ff0d7ed6ee6927dd16737:cascade#0002"}, {"source_title": "공지사항", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_c7b6fddff1d31bb01ca9983f:cascade#0004"}, {"source_title": "부산대학교", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_cbfe873b24f338b83d844924:cascade#0002"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0004"}, {"source_title": "2019 모범 적극행정 사례모음(작은용량).pdf (4MB)", "source_host": "pusan.ac.kr", "chunk_id": "doc_cb79a4e42dbe627631ccb38d:cascade#0302"}], "sources_b": [{"source_title": "[붙임 1] 장애학생 성장 자립 지원사업(정보통신보조기기 보급 자부담금 지원사업) 신청 안내문.hwpx", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_def2efd3bed70cdd221ae886:cascade#0010"}, {"source_title": "[붙임 1] 장애학생 성장 자립 지원사업(정보통신보조기기 보급 자부담금 지원사업) 신청 안내문.hwpx", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_def2efd3bed70cdd221ae886:cascade#0002"}, {"source_title": "부산대학교 장애학생지원센터", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_240ff0d7ed6ee6927dd16737:cascade#0002"}, {"source_title": "공지사항", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_c7b6fddff1d31bb01ca9983f:cascade#0004"}, {"source_title": "2019 모범 적극행정 사례모음(작은용량).pdf (4MB)", "source_host": "pusan.ac.kr", "chunk_id": "doc_cb79a4e42dbe627631ccb38d:cascade#0302"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "1. 장애학생 개인별 교육지원계획서 서식.hwp", "source_host": "sedu-support.pusan.ac.kr", "chunk_id": "doc_78b29abc580b1b6378101ca5:cascade#0006"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0011"}]}, {"id": "svc_sup_03", "category": "student_support", "role": null, "scores_a": [0, 0, 0], "scores_b": [0, 1, 1], "mean_a": 0, "mean_b": 0.6666666666666666, "delta_b_minus_a": 0.6666666666666666, "retrieval_hit_a": true, "retrieval_hit_b": true, "rank_a": 1, "rank_b": 1, "evidence_hit_a": false, "evidence_hit_b": false, "sources_changed": true, "query": "학교에서 인권침해를 목격했는데 피해자가 아닌 제가 대신 신고해도 되나요?", "reference": "인권센터 신고는 피해자가 아닌 제3자도 할 수 있으며, 이 경우 「부산대학교 인권센터 규정」에 따라 피해자 본인의 의사를 확인하여 상담·조사 여부를 결정합니다. 가해자와 피해자 중 한쪽만 우리 대학 구성원이어도 신고가 가능하지만 사건처리에 제약이 있을 수 있습니다. 다만 사건처리를 위해서는 피해자 본인의 인적사항을 인권센터에 알려야 합니다.", "answers_a": ["- 제공된 문서에서 인권침해 사건을 직접 겪지 않은 제3자가 대신 신고할 수 있는지에 대한 명확한 규정이나 절차는 확인할 수 없습니다.\n- 가해자가 다른 대학에 다니는 경우 피해자를 대신하여 가해자 소속 대학 인권센터의 사건처리절차 등을 확인하여 안내해 줄 수 있다는 내용만 확인됩니다.\n- 정확한 대리 신고 가능 여부 및 절차에 대해서는 담당 기관에 직접 문의하여 확인하시기 바랍니다.", "- 제공된 문서에서 인권침해 사건을 피해자가 아닌 제3자가 대신 신고할 수 있는지 여부에 대한 직접적인 규정이나 지침은 확인할 수 없습니다.\n- 다만 관련 용어 정의에 따르면 신고인은 성희롱·성폭력 피해를 겪었거나 사건을 인지하여 학내 상담실에 신고한 사람을 의미합니다.\n- 구체적인 대리 신고 허용 여부나 절차에 대해서는 담당 기관인 학내 인권센터에 직접 문의하여 확인하시기 바랍니다.", "- 제공된 문서에서 인권침해 사건을 목격한 제3자가 피해자를 대신해 직접 신고할 수 있는지 여부에 대한 명확한 규정은 확인할 수 없습니다.\n- 가해자가 다른 대학에 소속된 경우 피해자를 대신하여 가해자 소속 대학 인권센터의 사건처리절차 등을 확인하여 안내해 줄 수 있다는 내용만 확인됩니다.\n- 정확한 대리 신고 가능 여부는 담당 기관인 학내 인권센터에 직접 문의하여 확인하시기 바랍니다."], "answers_b": ["- 가해자가 다른 대학에 다니는 경우 피해자를 대신하여 가해자 소속 대학 인권센터의 사건처리절차 등을 확인하여 안내해 드릴 수 있습니다.", "- 피해자가 아닌 제3자도 인권침해 사실을 알고 있다면 상담소에 신고할 수 있습니다.\n- 신고자는 피해자와 동일한 보호를 받을 수 있습니다.", "- 인권침해 사건은 피해자가 아니더라도 그 사실을 알고 있는 제3자가 상담소에 신고할 수 있습니다.\n- 제3자가 신고한 경우에도 신고자는 피해자와 동일한 보호를 받을 수 있습니다.\n- 피해자 또는 제3자는 서면, 전화, 통신 및 방문 등의 방법으로 피해신고를 할 수 있습니다."], "reasons_a": ["제3자의 대리 신고가 가능함에도 불구하고 이를 확인할 수 없다고 답변하여 결론이 틀렸으며, 기준답안의 핵심 내용인 '피해자 의사 확인' 및 '인적사항 필요' 등의 절차를 전혀 반영하지 못했습니다.", "제3자 신고가 가능함에도 불구하고 이를 확인할 수 없다고 답변하여 결론이 틀렸으며, 기준답안의 핵심 내용인 '피해자 의사 확인' 및 '인적사항 필요' 등의 절차를 전혀 안내하지 못했습니다.", "제3자의 대리 신고가 가능함에도 불구하고 이를 확인할 수 없다고 답변하여 핵심 사실을 완전히 잘못 전달하였습니다."], "reasons_b": ["질문의 핵심인 '제3자 신고 가능 여부'와 '피해자 의사 확인 및 인적사항 필요'라는 필수 절차를 전혀 언급하지 않고 무관한 내용을 답변함.", "제3자 신고 가능 여부는 정확히 언급했으나, 피해자 의사 확인 및 인적사항 제공 필요성 등 핵심 절차와 조건이 누락되었습니다.", "제3자 신고 가능 여부는 정확히 답변했으나, 신고 시 피해자 의사 확인 절차 및 인적사항 제공 필요성 등 핵심적인 처리 조건이 누락되었습니다."], "sources_a": [{"source_title": "센터이용 Q&A", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_fa4289e74c7d60b3fa20f2e9:cascade#0006"}, {"source_title": "『2023년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_e1f0b2618fab91fdfd3bf0e8:cascade#0340"}, {"source_title": "[REN] 『2022년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_ee0a28316cc23c52c2fcc684:cascade#0021"}, {"source_title": "『2024년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_544340c9d8276d55a985e252:cascade#0271"}, {"source_title": "[REN] 『2022년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_ee0a28316cc23c52c2fcc684:cascade#0033"}, {"source_title": "『2025년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_a09004b63ff023fbb96d129c:cascade#0305"}, {"source_title": "『2024년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_544340c9d8276d55a985e252:cascade#0349"}, {"source_title": "인권 및 성폭력 상담 가이드북(내담자용).pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_c2692578bc9aed14894f48b6:cascade#0072"}], "sources_b": [{"source_title": "센터이용 Q&A", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_fa4289e74c7d60b3fa20f2e9:cascade#0006"}, {"source_title": "『2023년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_e1f0b2618fab91fdfd3bf0e8:cascade#0340"}, {"source_title": "[REN] 『2022년 PNU 성·인권 실태조사』 보고서.pdf", "source_host": "equality.pusan.ac.kr", "chunk_id": "doc_ee0a28316cc23c52c2fcc684:cascade#0021"}, {"source_title": "『2024년 PNU 성·인권 실태조사』 보고서.pdf _host": "www.pusan.ac.kr", "chunk_id": "doc_f8bfee3ec494ed8993de1f09:cascade#0000"}, {"source_title": "PDF 다운로드", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_7be18b9558a1be98c4eaec55:cascade#0025"}, {"source_title": "2026학년도 후기 한의학전문대학원 한의과학과 정원외특별전형 신입생 모집요강.pdf", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_3723bf87e3101cfc52bdcc87:cascade#0007"}, {"source_title": "HWP 다운로드", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_e62556e4620b2c9f3f71214e:cascade#0029"}]}, {"id": "svc_sch_03_role_student", "category": "scholarship", "role": "부산대학교 학생", "scores_a": [1, 1, 1], "scores_b": [0, 1, 1], "mean_a": 1, "mean_b": 0.6666666666666666, "delta_b_minus_a": -0.33333333333333337, "retrieval_hit_a": true, "retrieval_hit_b": true, "rank_a": 1, "rank_b": 1, "evidence_hit_a": true, "evidence_hit_b": true, "sources_changed": true, "query": "학자금대출 이자지원 장학금은 소득분위 제한이 있나요? 지원금은 제 통장으로 들어오는 건가요?", "reference": "학자금 대출이자 지원은 소득분위 제한이 없으며, 신청자가 많은 경우 예산 범위 내에서 학자금 지원구간이 낮은 순으로 선발됩니다. 지원액은 개인 통장이 아니라 한국장학재단에 개설된 개인별 원리금 상환계좌(상환용도의 일회성 가상계좌)로 입금되어 상환됩니다. 1인당 최대 지원액은 50만원입니다.", "answers_a": ["- 학자금대출 이자지원 장학금은 대출이자 지원의 소득분위 제한이 없습니다.", "- 학자금대출 이자지원 장학금은 대출이자 지원의 소득분위 제한이 없습니다.", "- 학자금대출 이자지원 장학금은 대출이자 지원의 소득분위 제한이 없습니다."], "answers_b": ["- 학자금대출 이자지원 장학금은 대출이자 지원의 소득분위 제한이 없습니다.\n- 다만 개인계좌 지원은 예외이며, 지자체 이자지원금 등은 학자금 대출 상환에 해당합니다.", "- 학자금대출 이자지원 장학금은 대출이자 지원의 소득분위 제한이 없습니다.\n- 다만 개인계좌 지원은 예외이며, 본인의 원금과 이자액은 한국장학재단 홈페이지에서 확인할 수 있습니다.", "- 학자금대출 이자지원 장학금은 소득분위 제한이 없습니다.\n- 대출이자 지원의 소득분위 제한은 없습니다.\n- 다만 모든 신청자격을 충족해야하며, 신청자가 많은 경우 예산 범위 내 학자금 지원구간이 낮은 순으로 선발 예정입니다."], "reasons_a": ["소득분위 제한 여부는 정확히 답변했으나, 지원금 지급 방식 및 선발 기준 등 핵심 정보가 누락되었습니다.", "소득분위 제한 여부는 정확히 답변했으나, 지원금 지급 방식 및 선발 기준 등 핵심 정보가 누락되었습니다.", "소득분위 제한 여부는 정확히 답변했으나, 지원금 지급 방식 및 선발 기준 등 핵심 정보가 누락되었습니다."], "reasons_b": ["지원금 입금 방식에 대해 '개인계좌 지원은 예외'라는 잘못된 정보를 제공하였고, 선발 기준 및 상환 방식에 대한 핵심 내용이 누락되었습니다.", "소득분위 제한 없음은 정확히 언급했으나, 지원금이 개인 통장이 아닌 한국장학재단 상환계좌로 입금된다는 핵심 절차를 명확히 설명하지 못하고 모호하게 표현함.", "소득분위 제한 여부와 선발 기준은 정확히 설명했으나, 지원금이 개인 통장이 아닌 한국장학재단 상환계좌로 입금된다는 핵심 절차 정보가 누락되었습니다."], "sources_a": [{"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0010"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622ee:cascade#0000"}, {"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622ee:cascade#0030"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_cc8665ee476fb3f8705b3a01:cascade#0005"}, {"source_title": "3. 별지 서식 제출 서류(학자금대출 관련)_최종.hwp (602KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_52354229e0dcad0b95a89fd6:cascade#0001"}, {"source_title": "FAQs", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_d24433fb6b8b431d2a7f1ded:cascade#0004"}, {"source_title": "2026학년도 2학기 AI학업장려 학자금대출 안내.hwp (120KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_8e29a0983ea7d5759bb215b2:cascade#0158"}], "sources_b": [{"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0010"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622ee:cascade#0000"}, {"source_title": "1. 2026년도 세종이도인재장학금 디딤돌장학사업 학자금대출 관련분야 신청 공고.pdf (313KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_068852ab3e764496382622ee:cascade#0030"}, {"source_title": "3. 별지 서식 제출 서류(학자금대출 관련)_최종.hwp (602KB)", "source_host": "www.pusan.ac.kr" cade#0006"}, {"source_title": "교육, 연구 및 학생지도 비용 내용 > 행정서비스 > 학교소개 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_c8940b0c0cb90108a14b7b9a:cascade#0006"}, {"source_title": "교육, 연구 및 학생지도 비용 > 행정서비스 > 학교소개 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_706f13bf60673cf887f4c282:cascade#0006"}]}, {"id": "svc_grad_03_role_free", "category": "graduation", "role": "대학원 박사과정 수료생", "scores_a": [1, 1, 1], "scores_b": [1, 1, 1], "mean_a": 1, "mean_b": 1, "delta_b_minus_a": 0, "retrieval_hit_a": true, "retrieval_hit_b": true, "rank_a": 1, "rank_b": 1, "evidence_hit_a": false, "evidence_hit_b": false, "sources_changed": true, "query": "박사과정 수료했는데 수료후연구생은 어떻게 신청하고 등록금은 얼마나 내나요?", "reference": "수료후연구생은 대학원 석사 또는 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 지도교수의 추천을 받은 학생이 신청할 수 있습니다. 2026학년도 2학기 1차 학생 신청기간은 26. 8. 3.(월)~8. 10.(월) 18:00, 2차는 26. 9. 2.(수)~9. 9.(수) 18:00이며, 학생지원시스템을 통한 온라인 신청이 원칙입니다. 납부금액은 수업료Ⅱ의 10%입니다.", "answers_a": ["- 부산대학교 대학원 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자가 신청 대상입니다.\n- 신청 방법은 지도교수 추천서를 첨부하여 학생지원시스템의 학적, 학생신청, 수료후연구생 신청 경로를 통해 온라인으로 신청하는 것입니다.\n- 제출 서류는 지도교수 추천서이며, 부득이한 경우에는 소속 학과로 문의하여 수기 신청도 병행하여 접수할 수 있습니다.\n- 관련 문의는 소속 학과 또는 제공된 안내문을 참고하시기 바랍니다.", "- 부산대학교 대학원 수료후연구생 신청 대상은 대학원 석사 또는 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자입니다.\n- 신청 방법은 학생지원시스템에 접속하여 학적, 학생신청, 수료후연구생 신청 경로를 통해 지도교수 추천서를 첨부하여 온라인으로 신청하는 것입니다.\n- 전산화되어 온라인 신청이 원칙이나 부득이한 경우에는 소속 학과로 문의하여 수기 신청도 병행하여 접수할 수 있습니다.", "- 수료후연구생은 대학원 석사 또는 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자가 대상입니다.\n- 신청 방법은 지도교수 추천서를 첨부하여 학생지원시스템에 접속한 뒤 학적, 학생신청, 수료후연구생 신청 순으로 온라인 신청하는 것입니다.\n- 제출 서류는 지도교수 추천서이며, 부득이한 경우에는 소속 학과로 문의하여 수기 신청도 병행하여 접수할 수 있습니다."], "answers_b": ["- 대학원 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자가 수료후연구생 신청 대상입니다.\n- 수료후연구생 신청 방법은 학생지원시스템에 접속하여 수료후연구생 추천서를 첨부하여 제출하는 방식으로 진행됩니다.", "- 대학원 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자는 수료후연구생을 신청할 수 있습니다.\n- 수료후연구생 신청은 학생지원시스템에 접속하여 수료후연구생 추천서를 첨부한 뒤 신청 상세정보를 입력하고 제출하면 됩니다.\n- 제출 서류로는 작성된 수료후연구생 추천서가 필요합니다.", "- 대학원 박사과정 수료자로서 학위취득에 필요한 연구를 희망하고 각 대학원 지도교수의 추천을 받은 자는 수료후연구생을 신청할 수 있습니다.\n- 신청 방법은 학생지원시스템의 학적, 학생신청, 수료후연구생 신청 메뉴에 접속하여 작성한 수료후연구생 추천서를 첨부하고 제출하면 됩니다."], "reasons_a": ["수료후연구생 신청의 핵심인 등록금 납부 금액(수업료Ⅱ의 10%)과 신청 기간에 대한 정보가 누락되었습니다.", "수료후연구생 신청의 핵심인 등록금 납부 금액과 신청 기간에 대한 정보가 누락되었습니다.", "수료후연구생 신청의 핵심인 납부 금액과 신청 기간에 대한 정보가 누락되어 있습니다."], "reasons_b": ["수료후연구생 신청 자격과 방법은 명시했으나, 가장 중요한 납부 금액과 신청 기간에 대한 정보가 모두 누락되었습니다.", "수료후연구생 신청 자격과 절차는 설명했으나, 가장 중요한 핵심 정보인 등록금 납부 금액과 신청 기간에 대한 안내가 누락되었습니다.", "수료후연구생 신청 자격과 절차는 안내했으나, 가장 중요한 핵심 정보인 등록금 납부 금액과 신청 기간이 모두 누락되었습니다."], "sources_a": [{"source_title": "1. 2026학년도 2학기 수료후연구생 신청 안내문.pdf (113KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_404d8854faaaeb2a8d6c48d3:cascade#0001"}, {"source_title": "2. (서식) 수료후연구생 추천서, 수기 신청서.pdf", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_57a52634d0a1e9c37ef0878f:cascade#0003"}, {"source_title": "1. 2026학년도 2학기 수료후연구생 신청 안내문.pdf (113KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_404d8854faaaeb2a8d6c48d3:cascade#0000"}, {"source_title": "[PDF]2027학년도 학생부위주전형 가이드북", "source_host": "go.pusan.ac.kr", "chunk_id": "doc_9800bc1c38aa5666e76d3bac:cascade#0133"}, {"source_title": "부산대학교", "source_host": "archaeology.pusan.ac.kr", "chunk_id": "doc_d0f51745fb4e05398092537f:cascade#0002"}, {"source_title": "2. 학자금대출 이자지원 Q&A.pdf (494KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_77566652b6e17fd16eb9bed8:cascade#0002"}, {"source_title": "공지사항 내용 > 공지사항 > 공지/참여 | 부산대학교", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_e36252984843a9f4c1722eb4:cascade#0005"}, {"source_title": "2. (서식) 수료후연구생 추천서, 수기 신청서.pdf", "source_host": "international.pusan.ac.kr", "chunk_id": "doc_57a52634d0a1e9c37ef0878f:cascade#0001"}], "sources_b": [{"source_title": "1. 2026학년도 2학기 수료후연구생 신청 안내문.pdf (113KB)", "source_host": "www.pusan.ac.kr", "chunk_id": "doc_404d8854faaaeb2a8d6c48d3:cascade#0001"}, {"source_title": "2. (서식) 수료후연구생 추천서, 수기 신청서.pdf", "source_h const pct=v=>(v*100).toFixed(1)+"%";const n=v=>Number(v).toFixed(3);const outcome=q=>q.delta_b_minus_a>0?"up":q.delta_b_minus_a<0?"down":"same";
function metric(label,a,b,fmt=n){return `<article class="metric"><span class="label">${label}</span><strong>${fmt(a)} → ${fmt(b)}</strong><small>Δ ${(b-a)>=0?"+":""}${fmt(b-a)}</small></article>`}
function renderMetrics(){const a=DATA.summary.a,b=DATA.summary.b,c=DATA.summary.comparison;document.querySelector("#metrics").innerHTML=metric("문서 Hit@5",a.retrieval.hit_rate,b.retrieval.hit_rate,pct)+metric("MRR",a.retrieval.mrr,b.retrieval.mrr)+metric("근거 청크 Hit",a.retrieval.evidence_hit_rate,b.retrieval.evidence_hit_rate,pct)+metric("생성 n=3 평균",a.mean,b.mean)+`<article class="metric"><span class="label">문항 승/무/패</span><strong>${c.wins_b} / ${c.ties} / ${c.losses_b}</strong><small>B 기준</small></article>`}
function sourceList(rows){const seen=new Set;return `<ul class="sources">${rows.filter(x=>{const k=(x.source_title||"")+"|"+(x.chunk_id||"");if(seen.has(k))return false;seen.add(k);return true}).map(x=>`<li>${esc(x.source_title||"제목 없음")} · ${esc(x.chunk_id||"")}</li>`).join("")}</ul>`}
function runs(q,key){const answers=q["answers_"+key],scores=q["scores_"+key],reasons=q["reasons_"+key];return answers.map((answer,i)=>`<article class="run"><div class="run-head"><span>run ${i+1}</span><span>${scores[i]}점</span></div><div class="answer">${esc(answer)}</div><div class="reason">${esc(reasons[i])}</div></article>`).join("")}
function caseHtml(q){const o=outcome(q),delta=q.delta_b_minus_a;return `<article class="case ${o}"><div class="topline"><span class="id">${esc(q.id)}</span><span class="badge">${esc(q.category)}</span>${q.role?`<span class="badge">${esc(q.role)}</span>`:""}<span class="badge ${o}">${o==="up"?"개선":o==="down"?"악화":"동일"} ${delta>0?"+":""}${delta.toFixed(2)}</span></div><div class="question">${esc(q.query)}</div><div class="scoreline"><div class="score"><small>Baseline</small><br><b>${q.mean_a.toFixed(2)}</b> <span>${esc(JSON.stringify(q.scores_a))}</span></div><span class="arrow">→</span><div class="score"><small>검색 튜닝</small><br><b>${q.mean_b.toFixed(2)}</b> <span>${esc(JSON.stringify(q.scores_b))}</span></div></div><div class="flags"><span>문서 ${q.retrieval_hit_a?"✓":"✕"}→${q.retrieval_hit_b?"✓":"✕"}</span><span>순위 ${q.rank_a??"-"}→${q.rank_b??"-"}</span><span>근거 ${q.evidence_hit_a?"✓":"✕"}→${q.evidence_hit_b?"✓":"✕"}</span><span>sources ${q.sources_changed?"변경":"동일"}</span></div><details><summary>기준답안·3회 답변·출처 펼치기</summary><div class="reference"><strong>기준답안</strong><br>${esc(q.reference)}</div><div class="answers"><section class="answer-col"><h3>Baseline</h3>${runs(q,"a")}${sourceList(q.sources_a)}</section><section class="answer-col"><h3>검색 튜닝</h3>${runs(q,"b")}${sourceList(q.sources_b)}</section></div></details></article>`}
function render(){const term=document.querySelector("#search").value.trim().toLowerCase(),out=document.querySelector("#outcome").value,cat=document.querySelector("#category").value;const rows=DATA.questions.filter(q=>(out==="all"||outcome(q)===out)&&(cat==="all"||q.category===cat)&&(!term||[q.id,q.query,q.reference].join(" ").toLowerCase().includes(term)));document.querySelector("#count").textContent=`${rows.length} / ${DATA.questions.length}문항`;document.querySelector("#cases").innerHTML=rows.map(caseHtml).join("")}
renderMetrics();[...new Set(DATA.questions.map(q=>q.category))].sort().forEach(c=>document.querySelector("#category").insertAdjacentHTML("beforeend",`<option value="${esc(c)}">${esc(c)}</option>`));["search","outcome","category"].forEach(id=>document.querySelector("#"+id).addEventListener(id==="search"?"input":"change",render));render();
</script>
